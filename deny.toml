[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# SQLx records its optional MySQL driver (and rsa) in Cargo.lock even though no
# workspace target enables that driver. The security workflow proves `rsa` is
# unreachable across the locked workspace/all-feature/all-target graph before
# either advisory command may use this exact lockfile-only exception.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # webpki-roots distributes Mozilla's CA dataset under this permissive data
  # license. Its attribution/license text is retained in generated notices.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal private workspace path dependencies intentionally inherit the
# workspace version. Registry dependencies remain subject to wildcards=deny.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
