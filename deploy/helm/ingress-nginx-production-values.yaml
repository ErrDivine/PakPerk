# Apply this overlay to the separately pinned ingress-nginx controller release
# that terminates Pakperk staging/production TLS. Pakperk's chart does not own
# the cluster-scoped controller, so a release is blocked unless these exact
# settings are present and scripts/verify_public_edge.sh passes.
controller:
  config:
    hsts: "true"
    hsts-include-subdomains: "true"
    hsts-max-age: "63072000"
    hsts-preload: "true"
    # Feed metadata is the only bulk public API response in v0.0. Keep
    # compression at the shared TLS edge explicit instead of depending on an
    # application-origin implementation detail. The protected public-edge
    # verifier requests gzip and checks both the encoded body and Vary header.
    use-gzip: "true"
    gzip-min-length: "256"
    gzip-types: "application/json"
