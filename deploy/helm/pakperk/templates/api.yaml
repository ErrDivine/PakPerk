apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pakperk.fullname" . }}-api
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pakperk.componentLabels" (dict "root" . "component" "api") | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/site-origin: {{ printf "%s|%s|%s" .Values.public.siteOrigin .Values.public.apiOrigin .Values.public.oidcIssuer | sha256sum }}
        checksum/runtime-secrets: {{ printf "%s|%s|%s|%s|%s|%s|%s|%s" .Values.secret.existingSecret .Values.secret.rotationVersion .Values.secret.apiDatabaseUrlKey .Values.secret.llmApiKeyKey .Values.secret.apiOriginHashKey .Values.secret.identityFingerprintKeysKey .Values.secret.deletionLedgerSigningKeysKey .Values.secret.deletionProviderIdentityKeysKey | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "pakperk.componentServiceAccountName" (dict "root" . "component" "api") }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      initContainers:
        {{- include "pakperk.apiSecretCopyInit" . | nindent 8 }}
        {{- if .Values.features.accountDeletion }}
        - name: prepare-deletion-ledger
          image: {{ include "pakperk.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ceu"]
          args: ["mkdir -p /ledger/data; chown 0:0 /ledger/data; chmod 0700 /ledger/data; chown 10001:10001 /ledger/data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"], add: ["CHOWN"] }
          volumeMounts:
            - { name: deletion-ledger, mountPath: /ledger }
        {{- end }}
      containers:
        - name: api
          image: {{ include "pakperk.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pakperk-api"]
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          env:
            - { name: APP_ENV, value: {{ .Values.environment | quote }} }
            - { name: LOG_FORMAT, value: "json" }
            - { name: RUST_LOG, value: "info,tower_http=info,sqlx=warn,reqwest=warn,hyper=warn" }
            - { name: API_BIND, value: "0.0.0.0:8080" }
            - { name: RUN_MIGRATIONS, value: "false" }
            - { name: DEMO_MODE, value: "false" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secret.existingSecret }}, key: {{ .Values.secret.apiDatabaseUrlKey }} } }
            - { name: DATABASE_POOL_SIZE, value: {{ .Values.api.databasePoolSize | quote }} }
            - { name: API_REQUEST_TIMEOUT_SECONDS, value: {{ .Values.api.requestTimeoutSeconds | quote }} }
            - { name: CHAT_REQUEST_TIMEOUT_SECONDS, value: {{ .Values.api.chatTimeoutSeconds | quote }} }
            - { name: API_MAX_REQUEST_BYTES, value: {{ .Values.api.maxRequestBytes | quote }} }
            - { name: CORS_ALLOWED_ORIGINS, value: {{ .Values.public.siteOrigin | quote }} }
            - { name: FULLTEXT_POLICY, value: {{ .Values.policy.fulltext | quote }} }
            - { name: ACCOUNTS_ENABLED, value: {{ include "pakperk.bool" .Values.features.accounts | quote }} }
            - { name: LIBRARY_ENABLED, value: {{ include "pakperk.bool" .Values.features.library | quote }} }
            - { name: LIBRARY_WRITES_ENABLED, value: {{ include "pakperk.bool" .Values.features.libraryWrites | quote }} }
            - { name: COMMENTS_ENABLED, value: {{ include "pakperk.bool" .Values.features.comments | quote }} }
            - { name: COMMENT_CREATION_ENABLED, value: {{ include "pakperk.bool" .Values.features.commentCreation | quote }} }
            - { name: ACCOUNT_DELETION_ENABLED, value: {{ include "pakperk.bool" .Values.features.accountDeletion | quote }} }
            - { name: OIDC_ISSUER_URL, value: {{ .Values.public.oidcIssuer | quote }} }
            - { name: OIDC_AUDIENCE, value: {{ .Values.public.oidcAudience | quote }} }
            - { name: OIDC_ALLOWED_ALGORITHMS, value: "RS256" }
            - { name: CURRENT_TERMS_VERSION, value: {{ .Values.policy.termsVersion | quote }} }
            - { name: CURRENT_COMMUNITY_GUIDELINES_VERSION, value: {{ .Values.policy.communityGuidelinesVersion | quote }} }
            - { name: COMMENT_MODERATION_PROVIDER, value: "rules" }
            - { name: COMMENT_SUPPORT_CONTACT_URL, value: {{ printf "%s/support/" .Values.public.siteOrigin | quote }} }
            - { name: API_ORIGIN_HASH_SECRET_FILE, value: "/var/run/pakperk-secrets/API_ORIGIN_HASH_SECRET" }
            - { name: API_TRUSTED_PROXY_CIDRS, value: {{ join "," .Values.api.trustedProxyCidrs | quote }} }
            {{- if .Values.features.accounts }}
            - { name: ACCOUNT_IDENTITY_FINGERPRINT_KEYS_FILE, value: "/var/run/pakperk-secrets/ACCOUNT_IDENTITY_FINGERPRINT_KEYS" }
            {{- end }}
            {{- if .Values.features.accountDeletion }}
            - { name: ACCOUNT_DELETION_LEDGER_DIRECTORY, value: "/var/lib/pakperk/deletion-ledger/data" }
            - { name: ACCOUNT_DELETION_LEDGER_ENVIRONMENT_ID, value: {{ .Values.deletionLedger.environmentId | quote }} }
            - { name: ACCOUNT_DELETION_LEDGER_SIGNING_KEYS_FILE, value: "/var/run/pakperk-secrets/ACCOUNT_DELETION_LEDGER_SIGNING_KEYS" }
            - { name: ACCOUNT_DELETION_PROVIDER_IDENTITY_KEYS_FILE, value: "/var/run/pakperk-secrets/ACCOUNT_DELETION_PROVIDER_IDENTITY_KEYS" }
            - { name: ACCOUNT_DELETION_LEDGER_RETENTION_DAYS, value: {{ .Values.deletionLedger.retentionDays | quote }} }
            - { name: ACCOUNT_SECURITY_RETENTION_DAYS, value: {{ .Values.deletionLedger.securityRetentionDays | quote }} }
            - { name: ACCOUNT_RECOVERABLE_BACKUP_DAYS, value: {{ .Values.deletionWorker.recoverableBackupDays | quote }} }
            {{- end }}
            - { name: LLM_PROVIDER, value: {{ .Values.paperWorker.llmProvider | quote }} }
            - { name: LLM_BASE_URL, value: {{ .Values.paperWorker.llmBaseUrl | quote }} }
            - { name: LLM_CHAT_MODEL, value: {{ .Values.paperWorker.llmChatModel | quote }} }
            - { name: LLM_EMBEDDING_MODEL, value: {{ .Values.paperWorker.llmEmbeddingModel | quote }} }
            - { name: EMBEDDING_DIMENSION, value: {{ .Values.paperWorker.embeddingDimension | quote }} }
            - { name: LLM_API_KEY_FILE, value: "/var/run/pakperk-secrets/LLM_API_KEY" }
            - { name: ARXIV_CONTACT_EMAIL, value: {{ .Values.paperWorker.arxivContactEmail | quote }} }
            - { name: ARXIV_USER_AGENT, value: {{ printf "Pakperk/%s" .Chart.AppVersion | quote }} }
            - { name: OTEL_SERVICE_NAME, value: {{ include "pakperk.otelServiceName" (dict "root" . "component" "api") | quote }} }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ printf "http://%s-otel-collector:4317" (include "pakperk.fullname" .) | quote }} }
            - { name: OTEL_EXPORTER_OTLP_INSECURE, value: "true" }
            - { name: OTEL_TRACES_SAMPLER_ARG, value: "0.10" }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          lifecycle:
            preStop: { exec: { command: ["/bin/sh", "-c", "sleep 5"] } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: owner-secrets, mountPath: /var/run/pakperk-secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.features.accountDeletion }}
            - { name: deletion-ledger, mountPath: /var/lib/pakperk/deletion-ledger }
            {{- end }}
      volumes:
        {{- include "pakperk.apiSecretVolumes" . | nindent 8 }}
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
        {{- if .Values.features.accountDeletion }}
        - name: deletion-ledger
          persistentVolumeClaim: { claimName: {{ .Values.deletionLedger.existingClaim }} }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pakperk.componentLabels" (dict "root" . "component" "api") | nindent 14 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pakperk.fullname" . }}-api
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "pakperk.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.api.service.port }}, targetPort: http, protocol: TCP }
{{- if .Values.api.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pakperk.fullname" . }}-api
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
