{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pakperk.fullname" . }}-migration
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "pakperk.componentLabels" (dict "root" . "component" "migration") | nindent 8 }}
      annotations:
        checksum/migration-contract: {{ printf "%s|%d|%s|%s|%s" .Values.migration.confirmBackupId (int .Values.migration.expectedVersion) .Values.secret.existingSecret .Values.secret.rotationVersion .Values.secret.migrationDatabaseUrlKey | sha256sum }}
    spec:
      serviceAccountName: {{ include "pakperk.migrationServiceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "pakperk.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.migration.command }}
          env:
            - { name: APP_ENV, value: {{ .Values.environment | quote }} }
            - { name: LOG_FORMAT, value: "json" }
            - { name: RUST_LOG, value: "info,sqlx=warn" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secret.existingSecret }}, key: {{ .Values.secret.migrationDatabaseUrlKey }} } }
            - { name: PAKPERK_MIGRATION_BACKUP_ID, value: {{ .Values.migration.confirmBackupId | quote }} }
            - { name: PAKPERK_MIGRATION_EXPECTED_VERSION, value: {{ .Values.migration.expectedVersion | quote }} }
            - { name: OTEL_SERVICE_NAME, value: {{ include "pakperk.otelServiceName" (dict "root" . "component" "migrate") | quote }} }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ printf "http://%s-otel-collector:4317" (include "pakperk.fullname" .) | quote }} }
            - { name: OTEL_EXPORTER_OTLP_INSECURE, value: "true" }
            - { name: OTEL_TRACES_SAMPLER_ARG, value: "1.0" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{ toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
{{- end }}
