{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pakperk.fullname" . }}-otel-collector
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
  annotations:
    pakperk.app/upstream-retention-days: {{ .Values.policy.operationalTelemetryRetentionDays | quote }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage/filelog:
        directory: /var/lib/otelcol/file-storage
        create_directory: true
        compaction:
          directory: /var/lib/otelcol/file-storage
          on_start: true
      file_storage/exporter_queue:
        directory: /var/lib/otelcol/exporter-queue
        create_directory: true
        compaction:
          directory: /var/lib/otelcol/exporter-queue
          on_start: true
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 4
          http:
            endpoint: 0.0.0.0:4318
      # Node-local backend stdout collection. Every include is scoped to this
      # release namespace/name and a named Rust container; site, collector,
      # GROBID, and unrelated namespace logs are never opened.
      filelog/pakperk_backend:
        include:
          - /var/log/pods/{{ .Release.Namespace }}_{{ include "pakperk.fullname" . }}-api-*_*/api/*.log
          - /var/log/pods/{{ .Release.Namespace }}_{{ include "pakperk.fullname" . }}-paper-worker-*_*/paper-worker/*.log
          - /var/log/pods/{{ .Release.Namespace }}_{{ include "pakperk.fullname" . }}-deletion-worker-*_*/deletion-worker/*.log
          - /var/log/pods/{{ .Release.Namespace }}_{{ include "pakperk.fullname" . }}-metadata-sync-*_*/metadata-sync/*.log
          - /var/log/pods/{{ .Release.Namespace }}_{{ include "pakperk.fullname" . }}-migration-*_*/migrate/*.log
          - /var/log/pods/{{ .Release.Namespace }}_{{ include "pakperk.fullname" . }}-telemetry-gateway-*_*/telemetry-gateway/*.log
        exclude:
          - /var/log/pods/{{ .Release.Namespace }}_{{ include "pakperk.fullname" . }}-otel-collector-*_*/collector/*.log
        start_at: beginning
        storage: file_storage/filelog
        # The container operator needs the path while parsing pod/container
        # metadata. The terminal retain operator below removes it before the
        # record leaves this receiver.
        include_file_path: true
        operators:
          - id: parse-cri
            type: container
            # Production nodes use containerd's CRI log framing. Declaring the
            # format avoids requiring log.file.path solely for auto-detection;
            # the path can therefore remain absent from every exported record.
            format: containerd
          - id: parse-pakperk-json
            type: json_parser
            parse_from: body
            parse_to: attributes.pakperk
            on_error: drop
          - id: require-message
            type: filter
            expr: 'attributes.pakperk.message == nil'
          - type: move
            from: attributes.pakperk.message
            to: body
          - type: move
            from: attributes.pakperk.level
            to: attributes["log.severity_text"]
          - type: move
            from: attributes.pakperk.target
            to: attributes["code.namespace"]
          # Drop all event fields, spans, raw JSON, CRI metadata, paths, and
          # accidental attributes. The message exists only until the downstream
          # transform replaces it with a constant marker or admits the one exact
          # content-free ledger alert message.
          - type: retain
            fields:
              - body
              - attributes["log.severity_text"]
              - attributes["code.namespace"]
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: {{ .Values.otelCollector.memoryLimitMiB }}
        spike_limit_mib: 64
      attributes/redact:
        # Process-level OTLP is a trusted transport, not a trusted payload. Keep
        # this denylist in lockstep with resource/redact below so a protected
        # value cannot bypass redaction by moving between signal and resource
        # attributes. The integration harness exercises every key on logs,
        # traces, and metric data points, plus a resource-level sentinel.
        actions:
          - { key: http.request.header.authorization, action: delete }
          - { key: http.request.header.cookie, action: delete }
          - { key: http.response.header.set-cookie, action: delete }
          - { key: authorization, action: delete }
          - { key: cookie, action: delete }
          - { key: set-cookie, action: delete }
          - { key: api_key, action: delete }
          - { key: api.key, action: delete }
          - { key: access_token, action: delete }
          - { key: refresh_token, action: delete }
          - { key: id_token, action: delete }
          - { key: id_token_hint, action: delete }
          - { key: oauth.access_token, action: delete }
          - { key: oauth.refresh_token, action: delete }
          - { key: oauth.id_token, action: delete }
          - { key: http.request.body, action: delete }
          - { key: http.request.body.content, action: delete }
          - { key: http.response.body, action: delete }
          - { key: http.response.body.content, action: delete }
          - { key: http.url, action: delete }
          - { key: http.target, action: delete }
          - { key: url.full, action: delete }
          - { key: url.query, action: delete }
          - { key: url.path, action: delete }
          - { key: db.statement, action: delete }
          - { key: db.query.text, action: delete }
          - { key: enduser.id, action: delete }
          - { key: user.id, action: delete }
          - { key: account.id, action: delete }
          - { key: provider.id, action: delete }
          - { key: oidc.subject, action: delete }
          - { key: oidc.sub, action: delete }
          - { key: oidc_sub, action: delete }
          - { key: subject, action: delete }
          - { key: user.email, action: delete }
          - { key: enduser.email, action: delete }
          - { key: email, action: delete }
          - { key: user.handle, action: delete }
          - { key: public.handle, action: delete }
          - { key: client.address, action: delete }
          - { key: source.address, action: delete }
          - { key: network.peer.address, action: delete }
          - { key: net.peer.ip, action: delete }
          - { key: http.client_ip, action: delete }
          - { key: device.id, action: delete }
          - { key: session.id, action: delete }
          - { key: search.query, action: delete }
          - { key: comment.body, action: delete }
          - { key: comment_body, action: delete }
          - { key: chat.message, action: delete }
          - { key: chat.message.content, action: delete }
          - { key: chat_message, action: delete }
          - { key: messaging.message.body, action: delete }
          - { key: paper.full_text, action: delete }
          - { key: paper.fulltext, action: delete }
          - { key: paper.content, action: delete }
          - { key: paper_full_text, action: delete }
          - { key: model.prompt, action: delete }
          - { key: model.response, action: delete }
          - { key: model_prompt, action: delete }
          - { key: model_response, action: delete }
          - { key: gen_ai.prompt, action: delete }
          - { key: gen_ai.completion, action: delete }
          - { key: gen_ai.input.messages, action: delete }
          - { key: gen_ai.output.messages, action: delete }
          - { key: gen_ai.system_instructions, action: delete }
          - { key: exception.message, action: delete }
          - { key: exception.stacktrace, action: delete }
          - { key: code.file.path, action: delete }
          - { key: file.path, action: delete }
          - { key: log.file.path, action: delete }
      resource/redact:
        attributes:
          - { key: http.request.header.authorization, action: delete }
          - { key: http.request.header.cookie, action: delete }
          - { key: http.response.header.set-cookie, action: delete }
          - { key: authorization, action: delete }
          - { key: cookie, action: delete }
          - { key: set-cookie, action: delete }
          - { key: api_key, action: delete }
          - { key: api.key, action: delete }
          - { key: access_token, action: delete }
          - { key: refresh_token, action: delete }
          - { key: id_token, action: delete }
          - { key: id_token_hint, action: delete }
          - { key: oauth.access_token, action: delete }
          - { key: oauth.refresh_token, action: delete }
          - { key: oauth.id_token, action: delete }
          - { key: http.request.body, action: delete }
          - { key: http.request.body.content, action: delete }
          - { key: http.response.body, action: delete }
          - { key: http.response.body.content, action: delete }
          - { key: http.url, action: delete }
          - { key: http.target, action: delete }
          - { key: url.full, action: delete }
          - { key: url.query, action: delete }
          - { key: url.path, action: delete }
          - { key: db.statement, action: delete }
          - { key: db.query.text, action: delete }
          - { key: enduser.id, action: delete }
          - { key: user.id, action: delete }
          - { key: account.id, action: delete }
          - { key: provider.id, action: delete }
          - { key: oidc.subject, action: delete }
          - { key: oidc.sub, action: delete }
          - { key: oidc_sub, action: delete }
          - { key: subject, action: delete }
          - { key: user.email, action: delete }
          - { key: enduser.email, action: delete }
          - { key: email, action: delete }
          - { key: user.handle, action: delete }
          - { key: public.handle, action: delete }
          - { key: client.address, action: delete }
          - { key: source.address, action: delete }
          - { key: network.peer.address, action: delete }
          - { key: net.peer.ip, action: delete }
          - { key: http.client_ip, action: delete }
          - { key: device.id, action: delete }
          - { key: session.id, action: delete }
          - { key: search.query, action: delete }
          - { key: comment.body, action: delete }
          - { key: comment_body, action: delete }
          - { key: chat.message, action: delete }
          - { key: chat.message.content, action: delete }
          - { key: chat_message, action: delete }
          - { key: messaging.message.body, action: delete }
          - { key: paper.full_text, action: delete }
          - { key: paper.fulltext, action: delete }
          - { key: paper.content, action: delete }
          - { key: paper_full_text, action: delete }
          - { key: model.prompt, action: delete }
          - { key: model.response, action: delete }
          - { key: model_prompt, action: delete }
          - { key: model_response, action: delete }
          - { key: gen_ai.prompt, action: delete }
          - { key: gen_ai.completion, action: delete }
          - { key: gen_ai.input.messages, action: delete }
          - { key: gen_ai.output.messages, action: delete }
          - { key: gen_ai.system_instructions, action: delete }
          - { key: exception.message, action: delete }
          - { key: exception.stacktrace, action: delete }
          - { key: code.file.path, action: delete }
          - { key: file.path, action: delete }
          - { key: log.file.path, action: delete }
      transform/redact-otlp-log-body:
        # An OTLP record body is an independent content channel; attribute
        # denylisting cannot sanitize it. Preserve only the exact event names
        # already admitted by the closed mobile gateway schema. Everything
        # else, including maps/arrays/bytes, becomes one static marker. The
        # backend stdout receiver has its own fail-closed body transform below.
        error_mode: propagate
        log_statements:
          - set(log.body, "otlp_log_body_redacted") where not IsString(log.body)
          - >-
            set(log.body, "otlp_log_body_redacted") where
            resource.attributes["service.name"] != "pakperk-mobile" or
            resource.attributes["deployment.environment.name"] != {{ .Values.environment | quote }} or
            scope.name != "app.pakperk.mobile" or
            not IsMatch(log.body, "^(app_cold_start|startup_ready|startup_failure|shell_destination_selected|paper_page_committed|paper_stage_committed|feed_prefetch_requested|feed_prefetch_succeeded|feed_prefetch_failed|feed_prefetch_deduplicated|next_paper_cache_hit|next_paper_cache_miss|feed_blank_card|feed_cache_rows|feed_cache_bytes|feed_time_to_readable_ms|reading_feed_shadow_decision|recommendation_card_rendered|save_requested|save_synced|save_failed|library_outbox_backlog|auth_started|auth_completed|auth_cancelled|comment_sheet_opened|comment_created|comment_pending|comment_rejected|comment_reported|user_reported|account_deletion_requested|account_deletion_accepted|account_deletion_unavailable|account_deletion_local_cleanup_failed|http_request_completed|mobile_error)$")
      transform/redact-backend-log-body:
        # Filelog messages are not trusted merely because they came from a
        # selected Pakperk container. Preserve only the exact content-free
        # two content-free signals used by the reviewed alert contract, with
        # exact severity/body/Rust-target pairings. Every other body becomes
        # one marker.
        error_mode: propagate
        log_statements:
          - set(log.body, "pakperk_backend_log") where not IsString(log.body)
          - >-
            set(log.body, "pakperk_backend_log") where
            log.attributes["log.severity_text"] != "ERROR"
          - >-
            set(log.body, "pakperk_backend_log") where
            log.body != "external deletion ledger failed verification" and
            log.body != "authenticated reading feed could not prove queue authority"
          - >-
            set(log.body, "pakperk_backend_log") where
            log.body == "external deletion ledger failed verification" and
            log.attributes["code.namespace"] != "account_deletion::worker"
          - >-
            set(log.body, "pakperk_backend_log") where
            log.body == "authenticated reading feed could not prove queue authority" and
            log.attributes["code.namespace"] != "pakperk_api::routes::reading_feed"
      resource/backend-defaults:
        attributes:
          - { key: service.name, value: pakperk-backend-stdout, action: upsert }
          - { key: deployment.environment.name, value: {{ .Values.environment | quote }}, action: upsert }
      batch:
        send_batch_size: 512
        send_batch_max_size: 1024
        timeout: 5s
    exporters:
      otlp:
        endpoint: ${env:PAKPERK_TELEMETRY_EXPORTER_ENDPOINT}
        headers: ${env:PAKPERK_TELEMETRY_EXPORTER_HEADERS}
        tls:
          insecure: false
        sending_queue:
          enabled: true
          queue_size: 2048
          storage: file_storage/exporter_queue
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          # Retain queued records until delivery or bounded queue saturation;
          # a transient outage must not expire the one-shot ledger alert.
          max_elapsed_time: 0s
    service:
      telemetry:
        logs:
          level: warn
        metrics:
          level: none
      extensions: [health_check, file_storage/filelog, file_storage/exporter_queue]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/redact, attributes/redact, batch]
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource/redact, attributes/redact, batch]
          exporters: [otlp]
        logs/otlp:
          receivers: [otlp]
          processors: [memory_limiter, resource/redact, attributes/redact, transform/redact-otlp-log-body, batch]
          exporters: [otlp]
        logs/backend-stdout:
          receivers: [filelog/pakperk_backend]
          processors: [memory_limiter, resource/redact, attributes/redact, resource/backend-defaults, transform/redact-backend-log-body, batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "pakperk.fullname" . }}-otel-collector
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  revisionHistoryLimit: 3
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 }
  selector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "otel-collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pakperk.componentLabels" (dict "root" . "component" "otel-collector") | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s|%s|%s" .Chart.Version .Values.environment (toJson .Values.otelCollector) | sha256sum }}
        checksum/runtime-secrets: {{ printf "%s|%s|%s" .Values.secret.existingSecret .Values.secret.rotationVersion .Values.secret.telemetryExporterHeadersKey | sha256sum }}
    spec:
      serviceAccountName: {{ include "pakperk.componentServiceAccountName" (dict "root" . "component" "otel-collector") }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: collector
          image: {{ printf "%s@%s" .Values.otelCollector.image.repository .Values.otelCollector.image.digest }}
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          args: ["--config=/conf/collector.yaml"]
          env:
            - { name: PAKPERK_TELEMETRY_EXPORTER_ENDPOINT, value: {{ .Values.otelCollector.exporterEndpoint | quote }} }
            - name: PAKPERK_TELEMETRY_EXPORTER_HEADERS
              valueFrom: { secretKeyRef: { name: {{ .Values.secret.existingSecret }}, key: {{ .Values.secret.telemetryExporterHeadersKey }} } }
          ports:
            - { name: otlp-grpc, containerPort: 4317, protocol: TCP }
            - { name: otlp-http, containerPort: 4318, protocol: TCP }
            - { name: health, containerPort: 13133, protocol: TCP }
          readinessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 20
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{ toYaml .Values.otelCollector.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: filelog-state, mountPath: /var/lib/otelcol/file-storage }
            - { name: exporter-queue-state, mountPath: /var/lib/otelcol/exporter-queue }
            - { name: pod-logs, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - name: config
          configMap: { name: {{ include "pakperk.fullname" . }}-otel-collector, defaultMode: 0444 }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: filelog-state
          emptyDir: { sizeLimit: 128Mi }
        - name: exporter-queue-state
          emptyDir: { sizeLimit: 128Mi }
        - name: pod-logs
          hostPath: { path: /var/log/pods, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pakperk.fullname" . }}-otel-collector
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  type: ClusterIP
  selector:
    {{- include "pakperk.componentLabels" (dict "root" . "component" "otel-collector") | nindent 4 }}
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc, protocol: TCP }
    - { name: otlp-http, port: 4318, targetPort: otlp-http, protocol: TCP }
{{- end }}
