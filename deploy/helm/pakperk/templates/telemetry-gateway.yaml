{{- if .Values.telemetryGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pakperk.fullname" . }}-telemetry-gateway
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-gateway
spec:
  replicas: {{ .Values.telemetryGateway.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "telemetry-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pakperk.componentLabels" (dict "root" . "component" "telemetry-gateway") | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s|%s|%s" .Values.environment .Values.public.mobileTelemetryOrigin (toJson .Values.telemetryGateway) | sha256sum }}
    spec:
      serviceAccountName: {{ include "pakperk.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: telemetry-gateway
          image: {{ include "pakperk.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.telemetryGateway.command }}
          env:
            - { name: APP_ENV, value: {{ .Values.environment | quote }} }
            - { name: LOG_FORMAT, value: "json" }
            - { name: RUST_LOG, value: "info,reqwest=warn,hyper=warn" }
            - { name: TELEMETRY_GATEWAY_BIND, value: "0.0.0.0:8080" }
            - { name: MOBILE_TELEMETRY_UPSTREAM_URL, value: {{ printf "http://%s-otel-collector:4318/v1/logs" (include "pakperk.fullname" .) | quote }} }
            - { name: OTEL_SERVICE_NAME, value: "pakperk-telemetry-gateway" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ printf "http://%s-otel-collector:4317" (include "pakperk.fullname" .) | quote }} }
            - { name: OTEL_EXPORTER_OTLP_INSECURE, value: "true" }
            - { name: OTEL_TRACES_SAMPLER_ARG, value: "0.05" }
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{ toYaml .Values.telemetryGateway.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pakperk.fullname" . }}-telemetry-gateway
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-gateway
spec:
  type: ClusterIP
  selector:
    {{- include "pakperk.componentLabels" (dict "root" . "component" "telemetry-gateway") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.telemetryGateway.service.port }}, targetPort: http, protocol: TCP }
{{- if .Values.telemetryGateway.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pakperk.fullname" . }}-telemetry-gateway
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-gateway
spec:
  minAvailable: {{ .Values.telemetryGateway.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "telemetry-gateway") | nindent 6 }}
{{- end }}
{{- end }}
