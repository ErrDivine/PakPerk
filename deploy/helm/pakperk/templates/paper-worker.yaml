{{- if .Values.paperWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pakperk.fullname" . }}-paper-worker
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: paper-worker
spec:
  replicas: {{ .Values.paperWorker.replicas }}
  revisionHistoryLimit: 3
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "paper-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pakperk.componentLabels" (dict "root" . "component" "paper-worker") | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/worker-config: {{ toJson .Values.paperWorker | sha256sum }}
        checksum/runtime-secrets: {{ printf "%s|%s|%s|%s" .Values.secret.existingSecret .Values.secret.rotationVersion .Values.secret.paperWorkerDatabaseUrlKey .Values.secret.llmApiKeyKey | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "pakperk.componentServiceAccountName" (dict "root" . "component" "paper-worker") }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.paperWorker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      initContainers:
        {{- include "pakperk.paperSecretCopyInit" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "pakperk.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pakperk-worker", "run"]
          env:
            - { name: APP_ENV, value: {{ .Values.environment | quote }} }
            - { name: LOG_FORMAT, value: "json" }
            - { name: RUST_LOG, value: "info,sqlx=warn,reqwest=warn,hyper=warn" }
            - { name: RUN_MIGRATIONS, value: "false" }
            - { name: DEMO_MODE, value: "false" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secret.existingSecret }}, key: {{ .Values.secret.paperWorkerDatabaseUrlKey }} } }
            - { name: DATABASE_POOL_SIZE, value: {{ .Values.paperWorker.databasePoolSize | quote }} }
            - name: WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: JOB_LEASE_SECONDS, value: {{ .Values.paperWorker.leaseSeconds | quote }} }
            - { name: JOB_POLL_INTERVAL_MS, value: {{ .Values.paperWorker.pollIntervalMs | quote }} }
            - { name: METADATA_SYNC_ON_START, value: "false" }
            - { name: METADATA_SYNC_INTERVAL_SECONDS, value: "31536000" }
            - { name: ARXIV_CATEGORIES, value: {{ .Values.paperWorker.arxivCategories | quote }} }
            - { name: ARXIV_BATCH_SIZE, value: {{ .Values.paperWorker.arxivBatchSize | quote }} }
            - { name: ARXIV_CONTACT_EMAIL, value: {{ .Values.paperWorker.arxivContactEmail | quote }} }
            - { name: ARXIV_USER_AGENT, value: {{ printf "Pakperk/%s" .Chart.AppVersion | quote }} }
            - { name: GROBID_URL, value: {{ printf "http://%s-grobid:8070" (include "pakperk.fullname" .) | quote }} }
            - { name: FULLTEXT_POLICY, value: {{ .Values.policy.fulltext | quote }} }
            - { name: LLM_PROVIDER, value: {{ .Values.paperWorker.llmProvider | quote }} }
            - { name: LLM_API_KEY_FILE, value: "/var/run/pakperk-secrets/LLM_API_KEY" }
            - { name: LLM_BASE_URL, value: {{ .Values.paperWorker.llmBaseUrl | quote }} }
            - { name: LLM_CHAT_MODEL, value: {{ .Values.paperWorker.llmChatModel | quote }} }
            - { name: LLM_EMBEDDING_MODEL, value: {{ .Values.paperWorker.llmEmbeddingModel | quote }} }
            - { name: EMBEDDING_DIMENSION, value: {{ .Values.paperWorker.embeddingDimension | quote }} }
            - { name: OTEL_SERVICE_NAME, value: {{ include "pakperk.otelServiceName" (dict "root" . "component" "paper-worker") | quote }} }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ printf "http://%s-otel-collector:4317" (include "pakperk.fullname" .) | quote }} }
            - { name: OTEL_EXPORTER_OTLP_INSECURE, value: "true" }
            - { name: OTEL_TRACES_SAMPLER_ARG, value: "0.10" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{ toYaml .Values.paperWorker.resources | nindent 12 }}
          volumeMounts:
            - { name: owner-secrets, mountPath: /var/run/pakperk-secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "pakperk.paperSecretVolumes" . | nindent 8 }}
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
