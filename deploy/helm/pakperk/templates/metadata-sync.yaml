{{- if .Values.metadataSync.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pakperk.fullname" . }}-metadata-manifest
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: metadata-sync
data:
  manifest.json: |
    {{- .Values.metadataSync.manifestJson | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "pakperk.fullname" . }}-metadata-sync
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: metadata-sync
spec:
  schedule: {{ .Values.metadataSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: {{ .Values.metadataSync.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "pakperk.componentLabels" (dict "root" . "component" "metadata-sync") | nindent 12 }}
          annotations:
            checksum/runtime-secrets: {{ printf "%s|%s|%s|%s" .Values.secret.existingSecret .Values.secret.rotationVersion .Values.secret.metadataSyncDatabaseUrlKey .Values.secret.llmApiKeyKey | sha256sum }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "pakperk.serviceAccountName" . }}
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            {{- include "pakperk.paperSecretCopyInit" . | nindent 12 }}
          containers:
            - name: metadata-sync
              image: {{ include "pakperk.appImage" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/usr/local/bin/pakperk-worker", "sync-metadata", "--manifest", "/inputs/manifest.json"]
              env:
                - { name: APP_ENV, value: {{ .Values.environment | quote }} }
                - { name: LOG_FORMAT, value: "json" }
                - { name: RUST_LOG, value: "info,sqlx=warn,reqwest=warn,hyper=warn" }
                - { name: RUN_MIGRATIONS, value: "false" }
                - { name: DEMO_MODE, value: "false" }
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: {{ .Values.secret.existingSecret }}, key: {{ .Values.secret.metadataSyncDatabaseUrlKey }} } }
                - { name: DATABASE_POOL_SIZE, value: "2" }
                - { name: WORKER_ID, value: "metadata-sync" }
                - { name: ARXIV_CONTACT_EMAIL, value: {{ .Values.paperWorker.arxivContactEmail | quote }} }
                - { name: ARXIV_USER_AGENT, value: {{ printf "Pakperk/%s" .Chart.AppVersion | quote }} }
                - { name: GROBID_URL, value: {{ printf "http://%s-grobid:8070" (include "pakperk.fullname" .) | quote }} }
                - { name: FULLTEXT_POLICY, value: {{ .Values.policy.fulltext | quote }} }
                - { name: LLM_PROVIDER, value: {{ .Values.paperWorker.llmProvider | quote }} }
                - { name: LLM_API_KEY_FILE, value: "/var/run/pakperk-secrets/LLM_API_KEY" }
                - { name: LLM_BASE_URL, value: {{ .Values.paperWorker.llmBaseUrl | quote }} }
                - { name: LLM_CHAT_MODEL, value: {{ .Values.paperWorker.llmChatModel | quote }} }
                - { name: LLM_EMBEDDING_MODEL, value: {{ .Values.paperWorker.llmEmbeddingModel | quote }} }
                - { name: EMBEDDING_DIMENSION, value: {{ .Values.paperWorker.embeddingDimension | quote }} }
                - { name: OTEL_SERVICE_NAME, value: "pakperk-metadata-sync" }
                - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ printf "http://%s-otel-collector:4317" (include "pakperk.fullname" .) | quote }} }
                - { name: OTEL_EXPORTER_OTLP_INSECURE, value: "true" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources: {{ toYaml .Values.paperWorker.resources | nindent 16 }}
              volumeMounts:
                - { name: owner-secrets, mountPath: /var/run/pakperk-secrets, readOnly: true }
                - { name: manifest, mountPath: /inputs, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            {{- include "pakperk.paperSecretVolumes" . | nindent 12 }}
            - name: manifest
              configMap: { name: {{ include "pakperk.fullname" . }}-metadata-manifest }
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }
{{- end }}
