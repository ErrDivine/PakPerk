{{- if and .Values.migration.enabled .Values.networkPolicy.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pakperk.migrationServiceAccountName" . }}
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    # These prerequisites must remain present while the later-weighted Job
    # runs. Deleting either resource as soon as its own hook succeeds would
    # make the dedicated ServiceAccount unavailable and remove the egress
    # boundary before the migration Pod is created.
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pakperk.fullname" . }}-migration
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "migration") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- include "pakperk.dnsEgress" . | nindent 4 }}
    {{- include "pakperk.databaseEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "pakperk.componentLabels" (dict "root" . "component" "otel-collector") | nindent 14 }}
      ports: [{ protocol: TCP, port: 4317 }]
{{- end }}
