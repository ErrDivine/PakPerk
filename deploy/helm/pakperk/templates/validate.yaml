{{- end -}}
{{- if and .Values.deletionWorker.enabled (lt (int .Values.deletionLedger.retentionDays) (int .Values.deletionLedger.securityRetentionDays)) -}}
{{- fail "deletionLedger.retentionDays must be at least deletionLedger.securityRetentionDays" -}}
