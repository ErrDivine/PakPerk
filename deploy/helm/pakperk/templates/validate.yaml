{{- if .Values.metadataSync.enabled -}}
{{- if not (regexMatch `^(\*|\*/([1-9]|[1-5][0-9])|[0-9]|[1-5][0-9]) (\*|\*/([1-9]|1[0-9]|2[0-3])|[0-9]|1[0-9]|2[0-3]) (\*|\*/([1-9]|[12][0-9]|3[01])|[1-9]|[12][0-9]|3[01]) (\*|\*/([1-9]|1[0-2])|[1-9]|1[0-2]) (\*|\*/[1-7]|[0-7])$` .Values.metadataSync.schedule) -}}
