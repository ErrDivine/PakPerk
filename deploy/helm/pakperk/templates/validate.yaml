{{- if and .Values.paperWorker.enabled (le (int .Values.paperWorker.terminationGracePeriodSeconds) (int .Values.paperWorker.leaseSeconds)) -}}
{{- fail "paperWorker.terminationGracePeriodSeconds must exceed leaseSeconds" -}}
