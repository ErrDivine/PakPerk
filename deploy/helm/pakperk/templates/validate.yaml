{{- if .Values.paperWorker.enabled -}}
{{- range $rawCategory := splitList "," .Values.paperWorker.arxivCategories -}}
{{- $category := trim $rawCategory -}}
{{- if and (not (empty $category)) (not (regexMatch `^[A-Za-z][A-Za-z0-9-]*(\.[A-Za-z][A-Za-z0-9-]*)?$` $category)) -}}
{{- fail "every paperWorker.arxivCategories entry must use the runtime arXiv category grammar" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.paperWorker.enabled (or (empty .Values.paperWorker.llmBaseUrl) (empty .Values.paperWorker.llmChatModel) (empty .Values.paperWorker.llmEmbeddingModel) (empty .Values.paperWorker.arxivContactEmail)) -}}
{{- fail "deployed paper workers require LLM coordinates/models and an arXiv contact" -}}
