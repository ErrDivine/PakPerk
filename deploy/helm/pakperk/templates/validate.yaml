{{- if or (not (regexMatch `^[A-Za-z0-9._/:-]{1,128}$` .Values.paperWorker.llmChatModel)) (not (regexMatch `^[A-Za-z0-9._/:-]{1,128}$` .Values.paperWorker.llmEmbeddingModel)) -}}
