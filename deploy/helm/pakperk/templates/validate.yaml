{{- fail "api.trustedProxyCidrs must contain at most 64 CIDR ranges" -}}
{{- end -}}
{{- range $cidr := .Values.api.trustedProxyCidrs -}}
{{- if or (eq $cidr "0.0.0.0/0") (eq $cidr "::/0") -}}
{{- fail "api.trustedProxyCidrs cannot trust an internet-wide range" -}}
{{- end -}}
{{- $_ := include "pakperk.ipv4CidrBounds" $cidr -}}
{{- end -}}
{{- if and .Values.features.commentCreation (not .Values.features.comments) -}}
{{- fail "features.commentCreation requires features.comments" -}}
{{- end -}}
{{- if and .Values.features.accountDeletion (not .Values.features.accounts) -}}
{{- fail "features.accountDeletion requires features.accounts" -}}
