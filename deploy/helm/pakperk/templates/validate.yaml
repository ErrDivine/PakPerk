{{- if and .Values.deletionWorker.enabled (ge (int .Values.deletionWorker.pollIntervalMs) (mul (int .Values.deletionWorker.leaseSeconds) 1000)) -}}
{{- fail "deletionWorker.pollIntervalMs must be shorter than leaseSeconds" -}}
