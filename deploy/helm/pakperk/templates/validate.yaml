{{- if and .Values.deletionWorker.enabled (ge (int .Values.deletionWorker.retryBaseSeconds) (int .Values.deletionWorker.retryMaxSeconds)) -}}
{{- fail "deletionWorker.retryBaseSeconds must be shorter than retryMaxSeconds" -}}
{{- end -}}
{{- if and .Values.deletionWorker.enabled (le (int .Values.deletionWorker.terminationGracePeriodSeconds) (int .Values.deletionWorker.leaseSeconds)) -}}
{{- fail "deletionWorker.terminationGracePeriodSeconds must exceed leaseSeconds" -}}
{{- end -}}
{{- if and .Values.deletionWorker.enabled (le (int .Values.deletionLedger.retentionDays) (int .Values.deletionWorker.recoverableBackupDays)) -}}
