{{- $arxivId := get $paper "arxiv_id" -}}
{{- if or (not (kindIs "string" $arxivId)) (not (regexMatch `^([0-9]{4}\.[0-9]{4,5}|[A-Za-z][A-Za-z0-9.-]*/[0-9]{7})(v[1-9][0-9]{0,8})?$` (toString $arxivId))) -}}
{{- fail "every metadataSync manifest paper must be an object with a canonical arxiv_id" -}}
