{{- if and .Values.ingress.enabled (ne .Values.public.mobileTelemetryOrigin (printf "https://%s" .Values.ingress.telemetryHost)) -}}
{{- fail "public.mobileTelemetryOrigin must exactly match ingress.telemetryHost" -}}
{{- end -}}
{{- range $key, $_ := .Values.ingress.annotations -}}
