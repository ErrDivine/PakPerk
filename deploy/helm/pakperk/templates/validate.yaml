{{- end -}}
{{- range $component, $endpoint := dict "api.commentModerationUrl" .Values.api.commentModerationUrl "paperWorker.llmBaseUrl" .Values.paperWorker.llmBaseUrl "deletionWorker.keycloakAdminBaseUrl" .Values.deletionWorker.keycloakAdminBaseUrl "otelCollector.exporterEndpoint" .Values.otelCollector.exporterEndpoint -}}
{{- if not (empty $endpoint) -}}
{{- $lowerEndpoint := lower $endpoint -}}
{{- if or (contains "localhost" $lowerEndpoint) (contains ".local" $lowerEndpoint) (contains ".test" $lowerEndpoint) (contains ".invalid" $lowerEndpoint) (contains ".example" $lowerEndpoint) (contains "example.com" $lowerEndpoint) (contains "example.org" $lowerEndpoint) (contains "example.net" $lowerEndpoint) -}}
{{- fail (printf "%s must not use a loopback, local, reserved, or placeholder host" $component) -}}
