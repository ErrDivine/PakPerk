{{- range $category, $ranges := dict "apiHttpsCidrs" .Values.networkPolicy.apiHttpsCidrs "arxivHttpsCidrs" .Values.networkPolicy.arxivHttpsCidrs "modelHttpsCidrs" .Values.networkPolicy.modelHttpsCidrs "identityAdminHttpsCidrs" .Values.networkPolicy.identityAdminHttpsCidrs "databaseCidrs" .Values.networkPolicy.databaseCidrs "telemetryCidrs" .Values.networkPolicy.telemetryCidrs -}}
{{- range $cidr := $ranges -}}
{{- if or (eq $cidr "0.0.0.0/0") (eq $cidr "::/0") -}}
{{- fail (printf "networkPolicy.%s cannot contain an internet-wide CIDR" $category) -}}
{{- end -}}
{{- $_ := include "pakperk.ipv4CidrBounds" $cidr -}}
{{- end -}}
{{- end -}}
{{- if .Values.networkPolicy.enabled -}}
{{- $providerBounds := dict -}}
{{- range $category, $ranges := dict "arxivHttpsCidrs" .Values.networkPolicy.arxivHttpsCidrs "modelHttpsCidrs" .Values.networkPolicy.modelHttpsCidrs "identityAdminHttpsCidrs" .Values.networkPolicy.identityAdminHttpsCidrs -}}
{{- $bounds := dict -}}
{{- range $cidr := $ranges -}}
{{- $_ := set $bounds $cidr (include "pakperk.ipv4CidrBounds" $cidr) -}}
{{- end -}}
{{- $_ := set $providerBounds $category $bounds -}}
{{- end -}}
{{- range $pair := list (list "arxivHttpsCidrs" "modelHttpsCidrs") (list "arxivHttpsCidrs" "identityAdminHttpsCidrs") (list "modelHttpsCidrs" "identityAdminHttpsCidrs") -}}
{{- $leftCategory := index $pair 0 -}}
{{- $rightCategory := index $pair 1 -}}
{{- range $leftCidr, $leftEncoded := index $providerBounds $leftCategory -}}
{{- $leftParts := splitList "," $leftEncoded -}}
{{- $leftStart := int64 (index $leftParts 0) -}}
{{- $leftEnd := int64 (index $leftParts 1) -}}
{{- range $rightCidr, $rightEncoded := index $providerBounds $rightCategory -}}
{{- $rightParts := splitList "," $rightEncoded -}}
{{- $rightStart := int64 (index $rightParts 0) -}}
{{- $rightEnd := int64 (index $rightParts 1) -}}
{{- if and (le $leftStart $rightEnd) (le $rightStart $leftEnd) -}}
{{- fail (printf "networkPolicy.%s entry %s overlaps %s entry %s" $leftCategory $leftCidr $rightCategory $rightCidr) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and (eq .Values.environment "production") (or (hasSuffix ".test" (lower .Values.public.supportEmail)) (hasSuffix ".invalid" (lower .Values.public.supportEmail)) (contains "@example." (lower .Values.public.supportEmail)) (hasSuffix "@localhost" (lower .Values.public.supportEmail)) (contains "placeholder" (lower .Values.public.supportEmail))) -}}
{{- fail "production public.supportEmail cannot use a reserved or placeholder domain" -}}
