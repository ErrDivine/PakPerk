{{- if or (ne $arxivContact .Values.paperWorker.arxivContactEmail) (not (regexMatch `^[A-Za-z0-9._%+-]+@[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)+$` $arxivContact)) (has $arxivContactDomain (list "example.com" "example.org" "example.net")) (hasSuffix ".invalid" $arxivContactDomain) -}}
{{- fail "paperWorker.arxivContactEmail must be a monitored, non-placeholder email address" -}}
