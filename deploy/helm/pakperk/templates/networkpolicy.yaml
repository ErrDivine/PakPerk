{{- if .Values.grobid.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pakperk.fullname" . }}-grobid
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "grobid") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [paper-worker, metadata-sync]
      ports: [{ protocol: TCP, port: 8070 }]
  egress: []
{{- end }}
{{- if .Values.otelCollector.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pakperk.fullname" . }}-otel-collector
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "otel-collector") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, telemetry-gateway, paper-worker, metadata-sync, deletion-worker, migration]
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
  egress:
    {{- include "pakperk.dnsEgress" . | nindent 4 }}
    {{- include "pakperk.telemetryEgress" . | nindent 4 }}
{{- end }}
{{- end }}
