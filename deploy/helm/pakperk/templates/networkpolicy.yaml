{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pakperk.fullname" . }}-api
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.ingressController.podSelector | nindent 14 }}
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    {{- include "pakperk.dnsEgress" . | nindent 4 }}
    {{- include "pakperk.databaseEgress" . | nindent 4 }}
    {{- include "pakperk.apiHttpsEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "pakperk.componentLabels" (dict "root" . "component" "otel-collector") | nindent 14 }}
      ports: [{ protocol: TCP, port: 4317 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pakperk.fullname" . }}-site
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "site") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.ingressController.podSelector | nindent 14 }}
      ports: [{ protocol: TCP, port: 8080 }]
  # Static files make no server-side network calls; API and OIDC requests are
  # made by the visitor's browser, not by this pod.
  egress: []
{{- if .Values.telemetryGateway.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pakperk.fullname" . }}-telemetry-gateway
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "telemetry-gateway") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.ingressController.podSelector | nindent 14 }}
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    {{- include "pakperk.dnsEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "pakperk.componentLabels" (dict "root" . "component" "otel-collector") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
{{- end }}
