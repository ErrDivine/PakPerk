{{- if .Values.deletionWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pakperk.fullname" . }}-deletion-worker
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: deletion-worker
spec:
  replicas: {{ .Values.deletionWorker.replicas }}
  revisionHistoryLimit: 3
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "deletion-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pakperk.componentLabels" (dict "root" . "component" "deletion-worker") | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/worker-config: {{ toJson .Values.deletionWorker | sha256sum }}
        checksum/runtime-secrets: {{ printf "%s|%s|%s|%s|%s|%s|%s" .Values.secret.existingSecret .Values.secret.rotationVersion .Values.secret.deletionWorkerDatabaseUrlKey .Values.secret.identityFingerprintKeysKey .Values.secret.deletionLedgerSigningKeysKey .Values.secret.deletionProviderIdentityKeysKey .Values.secret.oidcAdminClientSecretKey | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "pakperk.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.deletionWorker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      initContainers:
        {{- include "pakperk.deletionSecretCopyInit" . | nindent 8 }}
        - name: prepare-deletion-ledger
          image: {{ include "pakperk.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ceu"]
          args: ["mkdir -p /ledger/data; chown 0:0 /ledger/data; chmod 0700 /ledger/data; chown 10001:10001 /ledger/data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"], add: ["CHOWN"] }
          volumeMounts:
            - { name: deletion-ledger, mountPath: /ledger }
      containers:
        - name: deletion-worker
          image: {{ include "pakperk.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.deletionWorker.command }}
          args: ["run"]
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ceu", "test -f /tmp/pakperk-deletion-worker-ready"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - { name: APP_ENV, value: {{ .Values.environment | quote }} }
            - { name: LOG_FORMAT, value: "json" }
            - { name: RUST_LOG, value: "info,sqlx=warn,reqwest=warn,hyper=warn" }
            - { name: RUN_MIGRATIONS, value: "false" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secret.existingSecret }}, key: {{ .Values.secret.deletionWorkerDatabaseUrlKey }} } }
            - { name: DATABASE_POOL_SIZE, value: {{ .Values.deletionWorker.databasePoolSize | quote }} }
            - name: ACCOUNT_DELETION_WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: ACCOUNT_DELETION_JOB_LEASE_SECONDS, value: {{ .Values.deletionWorker.leaseSeconds | quote }} }
            - { name: ACCOUNT_DELETION_STEP_TIMEOUT_SECONDS, value: {{ .Values.deletionWorker.stepTimeoutSeconds | quote }} }
            - { name: ACCOUNT_DELETION_POLL_INTERVAL_MS, value: {{ .Values.deletionWorker.pollIntervalMs | quote }} }
            - { name: ACCOUNT_DELETION_RETRY_BASE_SECONDS, value: {{ .Values.deletionWorker.retryBaseSeconds | quote }} }
            - { name: ACCOUNT_DELETION_RETRY_MAX_SECONDS, value: {{ .Values.deletionWorker.retryMaxSeconds | quote }} }
            - { name: ACCOUNT_DELETION_CLEANUP_INTERVAL_SECONDS, value: {{ .Values.deletionWorker.cleanupIntervalSeconds | quote }} }
            - { name: ACCOUNT_DELETION_CLEANUP_BATCH_SIZE, value: {{ .Values.deletionWorker.cleanupBatchSize | quote }} }
            - { name: ACCOUNT_DELETION_MAX_ATTEMPTS, value: {{ .Values.deletionWorker.maximumAttempts | quote }} }
            - { name: ACCOUNT_DELETION_RECENT_AUTH_SECONDS, value: {{ .Values.deletionWorker.recentAuthSeconds | quote }} }
            - { name: ACCOUNT_DELETE_LIMIT, value: {{ .Values.deletionWorker.deleteLimit | quote }} }
            - { name: ACCOUNT_DELETE_WINDOW_SECONDS, value: {{ .Values.deletionWorker.deleteWindowSeconds | quote }} }
            - { name: ACCOUNT_RECOVERABLE_BACKUP_DAYS, value: {{ .Values.deletionWorker.recoverableBackupDays | quote }} }
            - { name: ACCOUNT_DELETION_PENDING_FILE_MAX_AGE_SECONDS, value: {{ .Values.deletionWorker.pendingFileMaxAgeSeconds | quote }} }
            - { name: ACCOUNT_IDENTITY_FINGERPRINT_KEYS_FILE, value: "/var/run/pakperk-secrets/ACCOUNT_IDENTITY_FINGERPRINT_KEYS" }
            - { name: ACCOUNT_DELETION_LEDGER_DIRECTORY, value: "/var/lib/pakperk/deletion-ledger/data" }
            - { name: ACCOUNT_DELETION_PROVIDER_IDENTITY_KEYS_FILE, value: "/var/run/pakperk-secrets/ACCOUNT_DELETION_PROVIDER_IDENTITY_KEYS" }
            - { name: ACCOUNT_DELETION_LEDGER_ENVIRONMENT_ID, value: {{ .Values.deletionLedger.environmentId | quote }} }
            - { name: ACCOUNT_DELETION_LEDGER_SIGNING_KEYS_FILE, value: "/var/run/pakperk-secrets/ACCOUNT_DELETION_LEDGER_SIGNING_KEYS" }
            - { name: ACCOUNT_SECURITY_RETENTION_DAYS, value: {{ .Values.deletionLedger.securityRetentionDays | quote }} }
            - { name: ACCOUNT_DELETION_LEDGER_RETENTION_DAYS, value: {{ .Values.deletionLedger.retentionDays | quote }} }
            - { name: IDENTITY_ADMIN_PROVIDER, value: "keycloak" }
            - { name: KEYCLOAK_ADMIN_BASE_URL, value: {{ .Values.deletionWorker.keycloakAdminBaseUrl | quote }} }
            - { name: KEYCLOAK_REALM, value: {{ .Values.deletionWorker.keycloakRealm | quote }} }
            - { name: KEYCLOAK_ADMIN_CLIENT_ID, value: {{ .Values.deletionWorker.keycloakAdminClientId | quote }} }
            - { name: KEYCLOAK_ADMIN_CLIENT_SECRET_FILE, value: "/var/run/pakperk-secrets/OIDC_ADMIN_CLIENT_SECRET" }
            - { name: OIDC_ISSUER_URL, value: {{ .Values.public.oidcIssuer | quote }} }
            - { name: OTEL_SERVICE_NAME, value: "pakperk-deletion-worker" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ printf "http://%s-otel-collector:4317" (include "pakperk.fullname" .) | quote }} }
            - { name: OTEL_EXPORTER_OTLP_INSECURE, value: "true" }
            - { name: OTEL_TRACES_SAMPLER_ARG, value: "0.10" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{ toYaml .Values.deletionWorker.resources | nindent 12 }}
          volumeMounts:
            - { name: owner-secrets, mountPath: /var/run/pakperk-secrets, readOnly: true }
            - { name: deletion-ledger, mountPath: /var/lib/pakperk/deletion-ledger }
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "pakperk.deletionSecretVolumes" . | nindent 8 }}
        - name: deletion-ledger
          persistentVolumeClaim: { claimName: {{ .Values.deletionLedger.existingClaim }} }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
