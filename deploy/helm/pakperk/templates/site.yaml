{{- if .Values.site.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pakperk.fullname" . }}-site
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: site
data:
  config.js: |
    window.__PAKPERK_PUBLIC_CONFIG__ = Object.freeze({
      environment: {{ .Values.environment | quote }},
      publicOrigin: {{ .Values.public.siteOrigin | quote }},
      apiBaseUrl: {{ .Values.public.apiOrigin | quote }},
      oidcIssuer: {{ .Values.public.oidcIssuer | quote }},
      oidcClientId: {{ .Values.public.oidcWebClientId | quote }},
      supportEmail: {{ .Values.public.supportEmail | quote }},
      documentVersion: {{ .Values.public.documentVersion | quote }}
    });
  assetlinks.json: |
    {{ list (dict "relation" (list "delegate_permission/common.handle_all_urls") "target" (dict "namespace" "android_app" "package_name" .Values.mobileAssociations.androidPackageName "sha256_cert_fingerprints" .Values.mobileAssociations.androidSha256Fingerprints)) | toJson }}
  apple-app-site-association: |
    {{ dict "applinks" (dict "details" (list (dict "appIDs" (list (printf "%s.%s" .Values.mobileAssociations.appleTeamId .Values.mobileAssociations.appleBundleId)) "components" (list (dict "/" "/p/*") (dict "/" "/arxiv/*"))))) | toJson }}
  default.conf: |
    log_format pakperk_safe '$status $request_method $uri $body_bytes_sent $request_time';

    map $uri $pakperk_cache_control {
        default "no-cache, max-age=0, must-revalidate";
        /config.js "no-store, max-age=0";
        /account-deletion/ "private, no-store, max-age=0";
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        server_tokens off;

        root /usr/share/nginx/html;
        index index.html;
        access_log /dev/stdout pakperk_safe;
        error_log /dev/stderr warn;

        add_header Cache-Control $pakperk_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self' {{ .Values.public.apiOrigin }} {{ .Values.public.oidcOrigin }}; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; upgrade-insecure-requests" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /config.js { try_files $uri =404; }
        location = /account-deletion/ { try_files $uri $uri/index.html =404; }
        location = /.well-known/assetlinks.json {
            default_type application/json;
            try_files $uri =404;
        }
        location = /.well-known/apple-app-site-association {
            default_type application/json;
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ $uri/index.html =404; }
        error_page 404 /404.html;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pakperk.fullname" . }}-site
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: site
spec:
  replicas: {{ .Values.site.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "site") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pakperk.componentLabels" (dict "root" . "component" "site") | nindent 8 }}
      annotations:
        checksum/site-config: {{ printf "%s|%s|%s|%s|%s|%s|%s|%s|%s|%s" .Chart.Version .Values.environment .Values.public.siteOrigin .Values.public.apiOrigin .Values.public.oidcOrigin .Values.public.oidcIssuer .Values.public.oidcWebClientId .Values.public.supportEmail .Values.public.documentVersion (toJson .Values.mobileAssociations) | sha256sum }}
    spec:
      serviceAccountName: {{ include "pakperk.componentServiceAccountName" (dict "root" . "component" "site") }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: site
          image: {{ include "pakperk.siteImage" . }}
          imagePullPolicy: {{ .Values.siteImage.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{ toYaml .Values.site.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: config, mountPath: /usr/share/nginx/html/config.js, subPath: config.js, readOnly: true }
            - { name: config, mountPath: /usr/share/nginx/html/.well-known/assetlinks.json, subPath: assetlinks.json, readOnly: true }
            - { name: config, mountPath: /usr/share/nginx/html/.well-known/apple-app-site-association, subPath: apple-app-site-association, readOnly: true }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: {{ include "pakperk.fullname" . }}-site, defaultMode: 0444 }
        - name: nginx-cache
          emptyDir: { sizeLimit: 16Mi }
        - name: nginx-run
          emptyDir: { sizeLimit: 4Mi }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pakperk.fullname" . }}-site
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: site
spec:
  type: ClusterIP
  selector:
    {{- include "pakperk.componentLabels" (dict "root" . "component" "site") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.site.service.port }}, targetPort: http, protocol: TCP }
{{- if .Values.site.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pakperk.fullname" . }}-site
  labels:
    {{- include "pakperk.labels" . | nindent 4 }}
    app.kubernetes.io/component: site
spec:
  minAvailable: {{ .Values.site.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "pakperk.componentLabels" (dict "root" . "component" "site") | nindent 6 }}
{{- end }}
{{- end }}
