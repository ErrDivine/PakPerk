{{- if .Values.serviceAccount.create }}
{{- $components := list "api" -}}
{{- if .Values.site.enabled }}{{- $components = append $components "site" -}}{{- end -}}
{{- if .Values.telemetryGateway.enabled }}{{- $components = append $components "telemetry-gateway" -}}{{- end -}}
{{- if .Values.paperWorker.enabled }}{{- $components = append $components "paper-worker" -}}{{- end -}}
{{- if .Values.metadataSync.enabled }}{{- $components = append $components "metadata-sync" -}}{{- end -}}
{{- if .Values.deletionWorker.enabled }}{{- $components = append $components "deletion-worker" -}}{{- end -}}
{{- if .Values.grobid.enabled }}{{- $components = append $components "grobid" -}}{{- end -}}
{{- if .Values.otelCollector.enabled }}{{- $components = append $components "otel-collector" -}}{{- end -}}
{{- range $component := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pakperk.componentServiceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "pakperk.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
