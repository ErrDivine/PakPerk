environment: ""

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

siteImage:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

secret:
  # Created by the deployment platform, never by this chart.
  # Every key below must be unique so each role and credential can be granted
  # and rotated independently.
  existingSecret: ""
  # Increment whenever the external Secret changes so copied/subPath-backed
  # material is rolled into fresh pods.
  rotationVersion: ""
  apiDatabaseUrlKey: API_DATABASE_URL
  paperWorkerDatabaseUrlKey: PAPER_WORKER_DATABASE_URL
  metadataSyncDatabaseUrlKey: METADATA_SYNC_DATABASE_URL
  deletionWorkerDatabaseUrlKey: DELETION_WORKER_DATABASE_URL
  migrationDatabaseUrlKey: MIGRATION_DATABASE_URL
  llmApiKeyKey: LLM_API_KEY
  commentModerationTokenKey: COMMENT_MODERATION_TOKEN
  apiOriginHashKey: API_ORIGIN_HASH_SECRET
  apiCursorEncryptionKeysKey: API_CURSOR_ENCRYPTION_KEYS
  identityFingerprintKeysKey: ACCOUNT_IDENTITY_FINGERPRINT_KEYS
  deletionLedgerSigningKeysKey: ACCOUNT_DELETION_LEDGER_SIGNING_KEYS
  deletionProviderIdentityKeysKey: ACCOUNT_DELETION_PROVIDER_IDENTITY_KEYS
  oidcAdminClientSecretKey: OIDC_ADMIN_CLIENT_SECRET
  telemetryExporterHeadersKey: OTEL_EXPORTER_HEADERS

public:
  siteOrigin: ""
  apiOrigin: ""
  mobileTelemetryOrigin: ""
  oidcOrigin: ""
  oidcIssuer: ""
  oidcAudience: pakperk-api
  oidcWebClientId: ""
  oidcNativeClientId: ""
  supportEmail: ""
  # Must exactly equal both policy acceptance versions below.
  documentVersion: ""

mobileAssociations:
  # Production signing identity values belong in the protected environment
  # values file, not in source control or the site image.
  androidPackageName: ""
  androidSha256Fingerprints: []
  appleTeamId: ""
  appleBundleId: ""

features:
  # Protected environment values opt into each production capability only
  # after that phase's smoke/evidence gate. Repository defaults stay dark.
  accounts: false
  library: false
  libraryWrites: false
  comments: false
  commentCreation: false
  accountDeletion: false

# Content-addressed references to protected, immutable release evidence. The
# rendered binding also covers every deployed image identity, the chart/app
# version, enabled features, alert policy, and the exact legal/full-text policy
# versions, so any release-contract change creates a new immutable ConfigMap.
# The repository defaults stay empty so staging can exercise gates without
# claiming that an external approval or live drill has happened. Production
# validation requires the applicable sha256 IDs before a feature can ship.
releaseEvidence:
  legalReviewId: ""
  moderationReadinessId: ""
  accountDeletionE2eId: ""
  restoreDrillId: ""
  reviewerFlowId: ""
  strictContentReviewId: ""

alerting:
  # The production-only provider-neutral policy is packaged as an immutable
  # ConfigMap. Production must pin its exact bytes and import them into the
  # platform alert engine; staging uses its own environment-bound adapter rules.
  # Rendering either artifact is not proof of live routing.
  enabled: false
  policySha256: ""

policy:
  fulltext: strict
  # The public legal document and both accepted policy versions are released
  # as one reviewed version by this chart.
  termsVersion: ""
  communityGuidelinesVersion: ""
  operationalTelemetryRetentionDays: 30

api:
  replicas: 2
  # "rules" is the deterministic built-in baseline. "http" enables the
  # provider-neutral, fail-closed HTTPS moderation adapter.
  commentModerationProvider: rules
  commentModerationUrl: ""
  commentModerationTimeoutMs: 2000
  # Source ranges actually observed by the API for the reviewed ingress proxy
  # chain. Keep this aligned with the NetworkPolicy ingress-controller boundary.
  trustedProxyCidrs: []
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: "1", memory: 768Mi }
  databasePoolSize: 10
  requestTimeoutSeconds: 30
  chatTimeoutSeconds: 70
  maxRequestBytes: 65536
  # Coarse per-client ingress protection. Shared database-backed application
  # quotas remain authoritative for prepare/chat/comment operations.
  edgeRateLimitRps: 20
  edgeBurstMultiplier: 2
  edgeConnectionLimit: 40
  terminationGracePeriodSeconds: 80
  service:
    port: 8080
  pdb:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true

telemetryGateway:
  enabled: true
  replicas: 2
  command: [/usr/local/bin/pakperk-telemetry-gateway]
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 192Mi }
  service:
    port: 8080
  pdb:
    enabled: true
    minAvailable: 1

paperWorker:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  databasePoolSize: 5
  leaseSeconds: 300
  pollIntervalMs: 1000
  arxivCategories: cs.AI,cs.CL,cs.LG
  arxivBatchSize: 100
  arxivContactEmail: ""
  llmProvider: openai_compatible
  llmBaseUrl: ""
  llmChatModel: ""
  llmEmbeddingModel: ""
  embeddingDimension: 384
  terminationGracePeriodSeconds: 330

deletionWorker:
  enabled: true
  replicas: 1
  command: [/usr/local/bin/pakperk-deletion-worker]
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  databasePoolSize: 5
  pollIntervalMs: 1000
  leaseSeconds: 60
  stepTimeoutSeconds: 30
  retryBaseSeconds: 5
  retryMaxSeconds: 3600
  cleanupIntervalSeconds: 3600
  cleanupBatchSize: 1000
  maximumAttempts: 12
  recentAuthSeconds: 300
  deleteLimit: 2
  deleteWindowSeconds: 3600
  recoverableBackupDays: 35
  pendingFileMaxAgeSeconds: 3600
  keycloakAdminBaseUrl: ""
  keycloakRealm: ""
  keycloakAdminClientId: ""
  terminationGracePeriodSeconds: 90

deletionLedger:
  # Must be a separately backed-up RWX volume, outside the PostgreSQL restore boundary.
  existingClaim: ""
  environmentId: ""
  retentionDays: 400
  securityRetentionDays: 90

migration:
  enabled: true
  command: [/usr/local/bin/pakperk-migrate]
  confirmBackupId: ""
  expectedVersion: 10
  activeDeadlineSeconds: 900
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 384Mi }

metadataSync:
  enabled: true
  schedule: "17 */6 * * *"
  startingDeadlineSeconds: 1800
  manifestJson: ""

site:
  enabled: true
  replicas: 2
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  service:
    port: 8080
  pdb:
    enabled: true
    minAvailable: 1

grobid:
  enabled: true
  image:
    repository: grobid/grobid
    digest: sha256:24ba90eb1c959f65d812bcdb2cf79c677fa5fd7b95235de616b8bc9fa1317849
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "2", memory: 4Gi }

otelCollector:
  enabled: true
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    digest: sha256:e0f565815b2b8e78eb9fdbb80f6190c921ab323aaa8ccceab3255c6d4225f4af
    pullPolicy: IfNotPresent
  exporterEndpoint: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  memoryLimitMiB: 384

ingress:
  # Set false only when an externally managed ingress implements the same TLS,
  # exact-host/path, body/time-limit, rate-limit, and query-safe logging
  # contract. NetworkPolicy ingress-controller selectors must still match it.
  enabled: true
  className: ""
  annotations: {}
  tlsSecretName: ""
  siteHost: ""
  apiHost: ""
  telemetryHost: ""

networkPolicy:
  enabled: true
  ingressController:
    # Both exact-match selector maps must remain non-empty. An empty selector
    # would admit every namespace or Pod to the public service ports.
    namespaceSelector:
      kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      app.kubernetes.io/component: controller
  # Standard Kubernetes NetworkPolicy has no portable FQDN selector. Resolve
  # and review these ranges for each managed environment before deployment.
  apiHttpsCidrs: []
  # arXiv, model-provider, and identity-admin ranges must be canonical IPv4
  # CIDRs with no equality, overlap, or containment across the three lists.
  # The split keeps the metadata-only CronJob unable to reach the model API.
  arxivHttpsCidrs: []
  modelHttpsCidrs: []
  identityAdminHttpsCidrs: []
  databaseCidrs: []
  databasePort: 5432
  telemetryCidrs: []
  telemetryPort: 4317
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    k8s-app: kube-dns

serviceAccount:
  # The chart creates one token-less ServiceAccount per workload. `name`, when
  # set, is a base prefix; when create=false the platform must pre-create each
  # derived <base>-<component> identity with no RBAC grants by default.
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
