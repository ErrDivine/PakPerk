name: pakperk

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  target: runtime

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    environment:
      POSTGRES_DB: pakperk
      POSTGRES_USER: pakperk
      POSTGRES_PASSWORD: pakperk
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pakperk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakperk -d pakperk"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  keycloak-postgres:
    profiles: ["accounts"]
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:-pakperk-keycloak-dev}
    volumes:
      - pakperk-keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mailpit:
    profiles: ["accounts"]
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    environment:
      MP_MAX_MESSAGES: 500
      MP_MAX_AGE: 7d
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  keycloak:
    profiles: ["accounts"]
    image: quay.io/keycloak/keycloak:26.7.2-1@sha256:831330513f55695572286e521f94fcd3c7e285250ed5b848090265a33192f669
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:-pakperk-keycloak-dev}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-pakperk-admin-dev}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-9001}:9000"
    volumes:
      - ./deploy/keycloak/pakperk-realm.json:/opt/keycloak/data/import/pakperk-realm.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  grobid:
    image: grobid/grobid:0.9.0-crf@sha256:24ba90eb1c959f65d812bcdb2cf79c677fa5fd7b95235de616b8bc9fa1317849
    init: true
    ulimits:
      core: 0
    ports:
      - "127.0.0.1:${GROBID_PORT:-8070}:8070"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    restart: unless-stopped

  api-origin-secret-init:
    image: pakperk-backend:dev
    build: *backend-build
    user: "0:0"
    command:
      - /bin/sh
      - -ceu
      - |
        test -f /source/API_ORIGIN_HASH_SECRET
        test ! -L /source/API_ORIGIN_HASH_SECRET
        test -f /source/API_CURSOR_ENCRYPTION_KEYS
        test ! -L /source/API_CURSOR_ENCRYPTION_KEYS
        chown 0:0 /work
        chmod 0700 /work
        rm -f /work/API_ORIGIN_HASH_SECRET /work/API_CURSOR_ENCRYPTION_KEYS
        install -m 0400 /source/API_ORIGIN_HASH_SECRET /work/API_ORIGIN_HASH_SECRET
        install -m 0400 /source/API_CURSOR_ENCRYPTION_KEYS /work/API_CURSOR_ENCRYPTION_KEYS
        chown 10001:10001 /work/API_ORIGIN_HASH_SECRET
        chown 10001:10001 /work/API_CURSOR_ENCRYPTION_KEYS
        chown 10001:10001 /work
    volumes:
      - ./.local/pakperk-secrets:/source:ro
      - pakperk-api-secrets:/work
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    image: pakperk-backend:dev
    build: *backend-build
    command: ["/usr/local/bin/pakperk-api"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://pakperk:pakperk@postgres:5432/pakperk
      GROBID_URL: http://grobid:8070
      DEMO_SEED_MANIFEST: /app/demo/seed_manifest.json
      DEMO_FALLBACK_FEED: /app/demo/fallback_feed.json
      API_ORIGIN_HASH_SECRET_FILE: /var/run/pakperk-secrets/API_ORIGIN_HASH_SECRET
      API_CURSOR_ENCRYPTION_KEYS_FILE: /var/run/pakperk-secrets/API_CURSOR_ENCRYPTION_KEYS
    volumes:
      - pakperk-api-secrets:/var/run/pakperk-secrets:ro
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      api-origin-secret-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    image: pakperk-backend:dev
    build: *backend-build
    command: ["/usr/local/bin/pakperk-worker", "run"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://pakperk:pakperk@postgres:5432/pakperk
      GROBID_URL: http://grobid:8070
      DEMO_SEED_MANIFEST: /app/demo/seed_manifest.json
      DEMO_FALLBACK_FEED: /app/demo/fallback_feed.json
    depends_on:
      postgres:
        condition: service_healthy
      grobid:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # One-off metadata tooling deliberately does not inherit `.env`. In
  # particular, GROBID_URL and LLM_API_KEY must be absent because the
  # metadata-only runtime rejects worker privileges before opening the
  # database or making a network request.
  metadata-sync:
    profiles: ["tools"]
    image: pakperk-backend:dev
    build: *backend-build
    command:
      - /usr/local/bin/pakperk-worker
      - sync-metadata
      - --manifest
      - /app/demo/seed_manifest.json
    environment:
      DATABASE_URL: postgres://pakperk:pakperk@postgres:5432/pakperk
      DATABASE_POOL_SIZE: "2"
      ARXIV_USER_AGENT: ${ARXIV_USER_AGENT:-Pakperk/0.2.0}
      ARXIV_CONTACT_EMAIL: ${ARXIV_CONTACT_EMAIL:-}
      ARXIV_MIN_INTERVAL_MS: ${ARXIV_MIN_INTERVAL_MS:-3000}
      ARXIV_REQUEST_TIMEOUT_SECONDS: ${ARXIV_REQUEST_TIMEOUT_SECONDS:-30}
      ARXIV_CACHE_TTL_SECONDS: ${ARXIV_CACHE_TTL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  pakperk-postgres:
  pakperk-keycloak-postgres:
  pakperk-api-secrets:
