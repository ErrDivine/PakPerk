name: pakperk

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    environment:
      POSTGRES_DB: pakperk
      POSTGRES_USER: pakperk
      POSTGRES_PASSWORD: pakperk
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pakperk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakperk -d pakperk"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  keycloak-postgres:
    profiles: ["accounts"]
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:-pakperk-keycloak-dev}
    volumes:
      - pakperk-keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mailpit:
    profiles: ["accounts"]
    image: axllent/mailpit:v1.30.6
    environment:
      MP_MAX_MESSAGES: 500
      MP_MAX_AGE: 7d
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  keycloak:
    profiles: ["accounts"]
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:-pakperk-keycloak-dev}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-pakperk-admin-dev}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-9001}:9000"
    volumes:
      - ./deploy/keycloak/pakperk-realm.json:/opt/keycloak/data/import/pakperk-realm.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  grobid:
    image: grobid/grobid:0.9.0-crf
    init: true
    ulimits:
      core: 0
    ports:
      - "127.0.0.1:${GROBID_PORT:-8070}:8070"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["/usr/local/bin/pakperk-api"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://pakperk:pakperk@postgres:5432/pakperk
      GROBID_URL: http://grobid:8070
      DEMO_SEED_MANIFEST: /app/demo/seed_manifest.json
      DEMO_FALLBACK_FEED: /app/demo/fallback_feed.json
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["/usr/local/bin/pakperk-worker", "run"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://pakperk:pakperk@postgres:5432/pakperk
      GROBID_URL: http://grobid:8070
      DEMO_SEED_MANIFEST: /app/demo/seed_manifest.json
      DEMO_FALLBACK_FEED: /app/demo/fallback_feed.json
    depends_on:
      postgres:
        condition: service_healthy
      grobid:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pakperk-postgres:
  pakperk-keycloak-postgres:
