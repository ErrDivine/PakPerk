name: pakperk

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    environment:
      POSTGRES_DB: pakperk
      POSTGRES_USER: pakperk
      POSTGRES_PASSWORD: pakperk
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pakperk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakperk -d pakperk"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  grobid:
    image: grobid/grobid:0.9.0-crf
    init: true
    ulimits:
      core: 0
    ports:
      - "127.0.0.1:${GROBID_PORT:-8070}:8070"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["/usr/local/bin/pakperk-api"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://pakperk:pakperk@postgres:5432/pakperk
      GROBID_URL: http://grobid:8070
      DEMO_SEED_MANIFEST: /app/demo/seed_manifest.json
      DEMO_FALLBACK_FEED: /app/demo/fallback_feed.json
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["/usr/local/bin/pakperk-worker", "run"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://pakperk:pakperk@postgres:5432/pakperk
      GROBID_URL: http://grobid:8070
      DEMO_SEED_MANIFEST: /app/demo/seed_manifest.json
      DEMO_FALLBACK_FEED: /app/demo/fallback_feed.json
    depends_on:
      postgres:
        condition: service_healthy
      grobid:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pakperk-postgres:
