name: live account deletion

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_DISPOSABLE_KEYCLOAK_DELETION to run the destructive disposable suite
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-account-deletion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  keycloak-deletion:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_TOOLCHAIN: 1.91.1
      DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm disposable destructive acceptance
        run: |
          if [[ "$DISPATCH_CONFIRMATION" != "RUN_DISPOSABLE_KEYCLOAK_DELETION" ]]; then
            echo "Dispatch confirmation did not match the required phrase." >&2
            exit 2
          fi
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Install bounded live-driver dependencies
        run: |
          python3 -c 'import sys; raise SystemExit(sys.version_info[:2] != (3, 12))'
          python3 -m venv "$RUNNER_TEMP/pakperk-live-account-deletion-venv"
          "$RUNNER_TEMP/pakperk-live-account-deletion-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --requirement scripts/requirements/live-account-deletion.txt
          echo "$RUNNER_TEMP/pakperk-live-account-deletion-venv/bin" >> "$GITHUB_PATH"
      - name: Run disposable Keycloak account deletion
        id: acceptance
        env:
          LIVE_ACCOUNT_DELETION_CONFIRM: RUN_DISPOSABLE_KEYCLOAK_DELETION
        run: ./scripts/test_live_account_deletion.sh
      - name: Record the disposable verification boundary
        if: always()
        shell: bash
        env:
          PAKPERK_ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          umask 077
          python3 - "$RUNNER_TEMP/live-account-deletion-scope.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          outcome = os.environ.get("PAKPERK_ACCEPTANCE_OUTCOME", "unknown")
          if outcome not in {"success", "failure", "cancelled", "skipped"}:
              outcome = "unknown"
          payload = {
              "schema": 1,
              "classification": (
                  "disposable development reference-provider exercise; "
                  "not protected staging or production release evidence"
              ),
              "source_revision": os.environ["GITHUB_SHA"],
              "acceptance_outcome": outcome,
              "external_paths_not_executed": [
                  "protected staging identity provider and secret manager",
                  "persistent independently backed deletion ledger",
                  "real backup inventory and restore target",
                  "deployed alert route and privacy-owner approval",
              ],
              "does_not_attest_external_paths": True,
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Require the scoped reference evidence
        if: always()
        shell: bash
        run: test -s "$RUNNER_TEMP/live-account-deletion-scope.json"
      - name: Retain scoped reference-provider evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-account-deletion-reference-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-account-deletion-scope.json
          if-no-files-found: error
          retention-days: 30
