name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.91.1
  FLUTTER_VERSION: 3.44.8

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - run: ./scripts/check_openapi.sh
        env:
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
        env:
          POSTGRES_DB: pakperk
          POSTGRES_USER: pakperk
          POSTGRES_PASSWORD: pakperk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pakperk -d pakperk"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://pakperk:pakperk@localhost:5432/pakperk
      TEST_DATABASE_URL: postgres://pakperk:pakperk@localhost:5432/pakperk
      EMBEDDING_DIMENSION: "64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup override set "$RUST_TOOLCHAIN"
      - run: bash -n scripts/*.sh
      - run: ./scripts/drill_backup_restore.sh --self-test
      - run: python3 -m py_compile scripts/*.py
      - name: Verify metadata-only Compose and seed privilege boundary
        run: python3 scripts/validate_metadata_sync_boundary.py
      - name: Verify immutable workflow references
        run: |
          python3 scripts/test_validate_workflow_pins.py
          python3 scripts/validate_workflow_pins.py
          python3 scripts/test_validate_release_image_workflow.py
          python3 scripts/validate_release_image_workflow.py
          python3 scripts/test_validate_android_native_sbom.py
          python3 scripts/test_validate_gradle_verification.py
          python3 scripts/validate_gradle_verification.py
          python3 scripts/test_validate_fastlane_lock.py
          python3 scripts/validate_fastlane_lock.py
          python3 scripts/test_validate_flutter_toolchain.py
          python3 scripts/test_validate_mobile_release_workflow.py
          python3 scripts/validate_mobile_release_workflow.py
          python3 scripts/test_validate_mobile_device_workflow.py
          python3 scripts/validate_mobile_device_workflow.py
          python3 scripts/test_validate_live_account_deletion_workflow.py
          python3 scripts/validate_live_account_deletion_workflow.py
          python3 scripts/test_live_comments_evidence.py
          python3 scripts/test_validate_live_comments_workflow.py
          python3 scripts/validate_live_comments_workflow.py
          python3 scripts/test_public_edge_evidence.py
          python3 scripts/test_verify_public_edge.py
          python3 scripts/test_validate_public_edge_workflow.py
          python3 scripts/validate_public_edge_workflow.py
      - name: Verify Docker context excludes local credentials
        run: python3 scripts/validate_dockerignore.py
      - name: Verify Android artifact-gate regressions
        run: |
          python3 scripts/test_verify_android_elf_alignment.py
          scripts/test_verify_signed_jar.sh
          python3 scripts/validate_gradle_wrapper.py
      - run: >-
          jq empty
          demo/seed_manifest.json
          demo/fallback_feed.json
          demo/expected_connections.json
          demo/content_evaluation.json
          mobile/assets/fallback_feed.json
          mobile/assets/prepared_introductions.json
          mobile/assets/prepared_connections.json
          deploy/keycloak/pakperk-realm.json
          deploy/helm/pakperk/values.schema.json
      - run: ./scripts/validate_keycloak_realm.sh
      - name: Verify live account-deletion harness contract without Docker
        run: ./scripts/test_live_account_deletion.sh --self-test
      - name: Verify backend load-gate contract without live calls
        run: python3 scripts/test_backend_load.py
      - run: ./scripts/validate_demo_content.sh
        env:
          PAKPERK_USE_DOCKER: "0"
      - name: Migrate an empty database and verify required extensions
        run: >-
          cargo test --manifest-path backend/Cargo.toml --locked
          --package db --lib
          repository::tests::migrations_apply_and_required_extensions_are_ready
          -- --ignored --exact --test-threads=1
      - name: Verify isolated empty, oldest-supported, and no-op migrations
        run: >-
          cargo test --manifest-path backend/Cargo.toml --locked
          --package pakperk-migrate --bin pakperk-migrate
          tests::empty_v1_and_latest_postgres_schemas_converge
          -- --exact --test-threads=1
      - run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path backend/Cargo.toml --locked --workspace --all-features
      - name: Exercise the standalone migration with the pre-install collector absent
        run: cargo run --locked --manifest-path backend/Cargo.toml --package pakperk-migrate
        env:
          APP_ENV: staging
          LOG_FORMAT: json
          RUST_LOG: info
          PAKPERK_MIGRATION_BACKUP_ID: ci-snapshot-${{ github.sha }}
          PAKPERK_MIGRATION_EXPECTED_VERSION: "10"
          OTEL_EXPORTER_OTLP_ENDPOINT: http://pakperk-ci-otel-collector:4317
          OTEL_EXPORTER_OTLP_INSECURE: "true"
          OTEL_EXPORT_TIMEOUT_SECONDS: "1"
          OTEL_METRIC_EXPORT_INTERVAL_SECONDS: "5"

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - working-directory: mobile
        run: dart format --output=none --set-exit-if-changed .
      - working-directory: mobile
        run: flutter analyze
      - name: Run the complete Flutter suite, including production verification
        working-directory: mobile
        run: flutter test
      - name: Build every Android debug flavor with its exact Dart environment
        working-directory: mobile
        run: |
          for flavor in dev staging prod; do
            flutter build apk --debug --flavor "$flavor" \
              --dart-define-from-file="config/$flavor.json"
          done
      - name: Verify strict staging and production Android artifacts
        working-directory: mobile
        run: |
          dart run tool/verify_strict_artifact_assets.dart build/app/outputs/flutter-apk/app-staging-debug.apk
          dart run tool/verify_strict_artifact_assets.dart build/app/outputs/flutter-apk/app-prod-debug.apk

  flutter-ios-flavors:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Select the reviewed Xcode toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          test "$(xcodebuild -version | awk '$1 == "Xcode" { print $2; exit }')" = 26.6
          test "$(xcodebuild -version | awk '$1 == "Build" && $2 == "version" { print $3; exit }')" = 17F113
      - working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Build every unsigned iOS simulator flavor
        working-directory: mobile
        run: |
          for flavor in dev staging prod; do
            flutter build ios --simulator --debug --flavor "$flavor" \
              --dart-define-from-file="config/$flavor.json"
            if [ "$flavor" != dev ]; then
              dart run tool/verify_strict_artifact_assets.dart build/ios/iphonesimulator/Runner.app
            fi
          done

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - working-directory: site
        run: npm ci --ignore-scripts
      - working-directory: site
        run: npm audit --audit-level=high
      - working-directory: site
        run: npx playwright install --with-deps chromium
      - working-directory: site
        run: npm test

  deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm 3.18.6 with checksum verification
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz \
            --output /tmp/helm-v3.18.6-linux-amd64.tar.gz
          echo '3f43c0aa57243852dd542493a0f54f1396c0bc8ec7296bbb2c01e802010819ce  /tmp/helm-v3.18.6-linux-amd64.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/helm-v3.18.6-linux-amd64.tar.gz --directory /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Verify provider-neutral production alert policy
        run: |
          python3 scripts/test_validate_alert_policy.py
          python3 scripts/validate_alert_policy.py
      - run: ./scripts/validate_helm_release.sh
      - name: Render the staging site contract
        run: |
          helm template pakperk deploy/helm/pakperk \
            --values deploy/helm/pakperk/ci/staging-values.yaml \
            >"${{ runner.temp }}/pakperk-rendered.yaml"
      - working-directory: site
        run: npm ci --ignore-scripts
      - name: Verify rendered CSP and public runtime configuration
        working-directory: site
        env:
          PAKPERK_RENDERED_SITE_MANIFEST: ${{ runner.temp }}/pakperk-rendered.yaml
        run: npx playwright test tests/static-security.spec.js
      - run: ./scripts/test_backend_log_export.sh
      - run: ./scripts/verify_mobile_associations.sh --help
      - run: ./scripts/verify_public_edge.sh --help
