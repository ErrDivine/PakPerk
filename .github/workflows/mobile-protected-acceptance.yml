                      "large_document_worst_device_peak_rss_growth_mib": ["range", 0, 96],
                      "large_document_worst_device_maximum_live_block_widgets": ["range", 1, 80],
                  },
              },
              "device_identity_hash_contract": {
                  "algorithm": "HMAC-SHA256",
                  "key_source": "root-owned-runner-device-identity-key",
                  "root_attestation_field": "physical_identities",
                  "challenge": os.environ["RUN_CHALLENGE"],
                  "distinct_across_roles": True,
