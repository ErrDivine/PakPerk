                  "to_read_first_queue_authority",
                  "to_read_first_fail_closed_mutations",
                  "to_read_first_account_scope_rollout",
                  "add_paper_exact_and_title_selection",
                  "add_paper_failure_retry_idempotency",
                  "plan02_search_lookup_explore_saved_queries",
                  "plan02_research_profile_personalization",
                  "plan02_why_and_feedback",
                  "plan02_reading_brief_progress_authority",
                  "plan02_subscription_notification_safety",
                  "plan03_deep_reader_document_navigation",
                  "plan03_passport_evidence_navigation",
                  "plan03_semantic_facets_definition_context",
                  "plan03_visual_objects_source_integrity",
                  "plan03_checkpoint_library_isolation",
                  "plan03_annotation_evidence_durability",
                  "plan03_research_memory_isolation",
                  "plan03_version_diff_reanchor_safety",
                  "plan03_assistant_evidence_integrity",
                  "plan03_reader_queue_and_large_document_safety",
              ],
          }
          serialized = (
              json.dumps(
                  request,
                  allow_nan=False,
                  ensure_ascii=True,
                  separators=(",", ":"),
                  sort_keys=True,
              )
              + "\n"
          ).encode("ascii")
          request_path = pathlib.Path(sys.argv[1])
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          if hasattr(os, "O_CLOEXEC"):
              flags |= os.O_CLOEXEC
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          descriptor = os.open(request_path, flags, 0o600)
          try:
              view = memoryview(serialized)
              while view:
                  written = os.write(descriptor, view)
                  if written <= 0:
                      raise SystemExit("request write did not make progress")
                  view = view[written:]
              os.fsync(descriptor)
              written_metadata = os.fstat(descriptor)
          finally:
              os.close(descriptor)
          current = os.lstat(request_path)
          identity = lambda value: (
              value.st_dev,
              value.st_ino,
              value.st_size,
              value.st_mtime_ns,
              value.st_ctime_ns,
          )
          if (
              not stat.S_ISREG(written_metadata.st_mode)
              or written_metadata.st_uid != os.getuid()
              or stat.S_IMODE(written_metadata.st_mode) != 0o600
              or written_metadata.st_nlink != 1
              or written_metadata.st_size != len(serialized)
              or identity(written_metadata) != identity(current)
          ):
              raise SystemExit("request is not one owner-only regular file")
          PY
          : >"$driver_log"
          chmod 0600 "$driver_log"
          cleanup_driver_log() {
            if [[ -e "$driver_log" || -L "$driver_log" ]]; then
              rm -f "$driver_log"
            fi
            rmdir "$private_dir"
          }
          trap cleanup_driver_log EXIT
          trap 'exit 130' HUP INT TERM
          if ! (
            ulimit -f 2048
            unset GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY RUNNER_TEMP
            exec /opt/pakperk/bin/pakperk-mobile-acceptance-driver run \
              --request "$request" \
              --candidate-manifest "$CANDIDATE_MANIFEST" \
              --provenance-manifest "$PROVENANCE_MANIFEST" \
              --runner-session-manifest "$RUNNER_SESSION_MANIFEST" \
              --evidence "$evidence"
          ) >"$driver_log" 2>&1; then
            echo "Protected mobile acceptance driver failed; its private log was discarded." >&2
            exit 1
          fi
          echo "Protected physical-device acceptance completed."

      - name: Validate and atomically package sanitized acceptance evidence
        id: evidence-package
        if: always()
        continue-on-error: true
        shell: bash
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          CANDIDATE_MANIFEST: ${{ steps.candidate.outputs.manifest }}
          PROVENANCE_MANIFEST: ${{ steps.candidate.outputs.provenance_manifest }}
          RUNNER_SESSION_MANIFEST: ${{ steps.candidate.outputs.runner_session_manifest }}
          RUN_CHALLENGE: ${{ steps.candidate.outputs.challenge }}
          RUN_NOT_BEFORE: ${{ steps.candidate.outputs.not_before }}
          RUN_ID_BINDING: ${{ github.run_id }}
          RUN_ATTEMPT_BINDING: ${{ github.run_attempt }}
          SOURCE_BINDING: ${{ steps.source.outputs.source_binding }}
          PAKPERK_APP_VERSION: ${{ steps.source.outputs.app_version }}
          PAKPERK_BUILD_NUMBER: ${{ steps.source.outputs.build_number }}
        run: |
          evidence_dir="$RUNNER_TEMP/pakperk-mobile-acceptance-evidence"
          evidence="$evidence_dir/mobile-acceptance-evidence.json"
          archive="$RUNNER_TEMP/pakperk-mobile-acceptance-$REQUESTED_REVISION.tar"
          umask 077
          if [[ "$ACCEPTANCE_OUTCOME" != "success" ]]; then
            echo "The protected mobile acceptance driver did not complete successfully." >&2
            exit 1
          fi
          if [[ "$(/usr/bin/git rev-parse HEAD)" != "$REQUESTED_REVISION" || "$(/usr/bin/git rev-parse refs/remotes/origin/main)" != "$REQUESTED_REVISION" ]]; then
            echo "The reviewed source identity changed before evidence validation." >&2
            exit 1
          fi
          if ! /usr/bin/git diff --quiet || ! /usr/bin/git diff --cached --quiet; then
            echo "Tracked source changed before evidence validation." >&2
            exit 1
          fi
          workspace_state="$(/usr/bin/git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          if [[ -n "$workspace_state" ]]; then
            echo "The protected checkout contains untracked or ignored files." >&2
            exit 1
          fi
          if [[ -e "$archive" || -L "$archive" ]]; then
            echo "Mobile acceptance evidence archive path is not fresh." >&2
            exit 1
          fi
          /usr/bin/python3 -I - "$evidence_dir" "$evidence" <<'PY'
          import os
          import pathlib
          import stat
          import sys

          evidence_dir = pathlib.Path(sys.argv[1])
          evidence = pathlib.Path(sys.argv[2])
          directory_metadata = os.lstat(evidence_dir)
          if (
              not stat.S_ISDIR(directory_metadata.st_mode)
              or directory_metadata.st_uid != os.getuid()
              or directory_metadata.st_mode & 0o077
          ):
              raise SystemExit("the evidence directory is not owner-only")
          entries = list(os.scandir(evidence_dir))
          if len(entries) != 1 or pathlib.Path(entries[0].path) != evidence:
              raise SystemExit("the evidence directory contains data outside the closed artifact")
          metadata = os.lstat(evidence)
          if (
              not stat.S_ISREG(metadata.st_mode)
              or metadata.st_uid != os.getuid()
              or metadata.st_mode & 0o077
              or metadata.st_nlink != 1
          ):
              raise SystemExit("the evidence artifact is not one owner-only regular file")
          PY
          /usr/bin/python3 -I \
            /opt/pakperk/bin/pakperk-mobile-acceptance-validator.py \
            validate-and-package \
            "$evidence" "$archive" \
            --candidate-manifest "$CANDIDATE_MANIFEST" \
            --provenance-manifest "$PROVENANCE_MANIFEST" \
            --runner-session-manifest "$RUNNER_SESSION_MANIFEST" \
            --source-revision "$REQUESTED_REVISION" \
            --candidate-id "$CANDIDATE_ID" \
            --provenance-id "$PROVENANCE_ID" \
            --runner-session-id "$RUNNER_SESSION_ID" \
            --validator-sha256 "$VALIDATOR_SHA256" \
            --driver-sha256 "$DRIVER_SHA256" \
            --app-version "$PAKPERK_APP_VERSION" \
            --build-number "$PAKPERK_BUILD_NUMBER" \
            --source-binding "$SOURCE_BINDING" \
            --android-signer-sha256 "$ANDROID_SIGNER_SHA256" \
            --ios-team-id "$IOS_TEAM_ID" \
            --ios-signer-sha256 "$IOS_SIGNER_SHA256" \
            --run-id "$RUN_ID_BINDING" \
            --run-attempt "$RUN_ATTEMPT_BINDING" \
            --run-challenge "$RUN_CHALLENGE" \
            --not-before "$RUN_NOT_BEFORE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify packaged archive immediately before upload
        id: archive-verify
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PACKAGE_OUTCOME: ${{ steps.evidence-package.outcome }}
          ARCHIVE_SHA256: ${{ steps.evidence-package.outputs.archive_sha256 }}
        run: |
          archive="$RUNNER_TEMP/pakperk-mobile-acceptance-$REQUESTED_REVISION.tar"
          if [[ "$PACKAGE_OUTCOME" != "success" ]]; then
            echo "The acceptance archive was not packaged successfully." >&2
            exit 1
          fi
          if ! [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The packaged acceptance archive digest is unavailable or invalid." >&2
            exit 1
          fi
          /usr/bin/python3 -I \
            /opt/pakperk/bin/pakperk-mobile-acceptance-validator.py \
            verify-archive \
            "$archive" \
            --expected-sha256 "$ARCHIVE_SHA256" \
            --expected-validator-sha256 "$VALIDATOR_SHA256" \
            --expected-driver-sha256 "$DRIVER_SHA256"

      - name: Upload exact-source protected mobile acceptance evidence
        id: evidence-upload
        if: steps.evidence-package.outcome == 'success' && steps.archive-verify.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-mobile-acceptance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.evidence-package.outputs.archive_sha256 }}
          path: ${{ runner.temp }}/pakperk-mobile-acceptance-${{ github.sha }}.tar
          if-no-files-found: error
          retention-days: 90

      - name: Enforce protected mobile acceptance result
        if: always()
        shell: bash
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          PACKAGE_OUTCOME: ${{ steps.evidence-package.outcome }}
          ARCHIVE_VERIFY_OUTCOME: ${{ steps.archive-verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence-upload.outcome }}
          ARCHIVE_SHA256: ${{ steps.evidence-package.outputs.archive_sha256 }}
          UPLOADED_ARTIFACT_DIGEST: ${{ steps.evidence-upload.outputs.artifact-digest }}
        run: |
          if [[ "$ACCEPTANCE_OUTCOME" != "success" || "$PACKAGE_OUTCOME" != "success" || "$ARCHIVE_VERIFY_OUTCOME" != "success" || "$UPLOAD_OUTCOME" != "success" ]]; then
            echo "Protected mobile acceptance or its exact-source evidence failed." >&2
            exit 1
          fi
          if ! [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ && "$UPLOADED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Protected mobile acceptance archive digest binding is incomplete." >&2
            exit 1
          fi
          echo "Validated protected acceptance archive SHA-256: $ARCHIVE_SHA256"
          echo "Uploaded artifact container SHA-256: $UPLOADED_ARTIFACT_DIGEST"
