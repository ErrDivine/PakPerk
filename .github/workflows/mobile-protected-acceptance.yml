name: protected mobile acceptance

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Reviewed full lowercase commit SHA that exactly matches the selected main revision
        required: true
        type: string
      candidate_id:
        description: Installed signed-candidate manifest content ID in exact sha256 lowercase digest form
        required: true
        type: string
      provenance_id:
        description: Signed-release provenance manifest content ID in exact sha256 lowercase digest form
        required: true
        type: string
      confirmation:
        description: Type RUN_PROTECTED_MOBILE_ACCEPTANCE to exercise disposable staging accounts and physical devices
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: protected-mobile-acceptance
  cancel-in-progress: false

jobs:
  protected-acceptance:
    runs-on: [self-hosted, macOS, pakperk-mobile-acceptance]
    environment: mobile-device-verification
    timeout-minutes: 360
    env:
      REQUESTED_REVISION: ${{ inputs.source_revision }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      PROVENANCE_ID: ${{ inputs.provenance_id }}
      DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
      RUNNER_SESSION_ID: ${{ vars.PAKPERK_MOBILE_RUNNER_SESSION_ID }}
      VALIDATOR_SHA256: ${{ vars.PAKPERK_MOBILE_ACCEPTANCE_VALIDATOR_SHA256 }}
      DRIVER_SHA256: ${{ vars.PAKPERK_MOBILE_ACCEPTANCE_DRIVER_SHA256 }}
      ANDROID_SIGNER_SHA256: ${{ vars.PAKPERK_ANDROID_SIGNER_SHA256 }}
      IOS_TEAM_ID: ${{ vars.PAKPERK_IOS_TEAM_ID }}
      IOS_SIGNER_SHA256: ${{ vars.PAKPERK_IOS_SIGNER_SHA256 }}
      PATH: /usr/bin:/bin
      PYTHONDONTWRITEBYTECODE: "1"
      BASH_ENV: /dev/null
      ENV: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact reviewed main source and protected coordinates
        id: source
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REVISION: ${{ github.sha }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Protected mobile acceptance must be dispatched from main." >&2
            exit 2
          fi
          if [[ "$DISPATCH_CONFIRMATION" != "RUN_PROTECTED_MOBILE_ACCEPTANCE" ]]; then
            echo "Dispatch confirmation did not match the required phrase." >&2
            exit 2
          fi
          if ! [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_revision must be a full lowercase Git commit SHA." >&2
            exit 2
          fi
          if ! [[ "$CANDIDATE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "candidate_id must be an exact lowercase sha256 content ID." >&2
            exit 2
          fi
          if ! [[ "$PROVENANCE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "provenance_id must be an exact lowercase sha256 content ID." >&2
            exit 2
          fi
          if ! [[ "$RUNNER_SESSION_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The protected runner-session attestation ID is unavailable or invalid." >&2
            exit 2
          fi
          if ! [[ "$VALIDATOR_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The protected mobile acceptance validator digest is unavailable or invalid." >&2
            exit 2
          fi
          if ! [[ "$DRIVER_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The protected mobile acceptance driver digest is unavailable or invalid." >&2
            exit 2
          fi
          if [[ "$REQUESTED_REVISION" != "$DISPATCH_REVISION" ]]; then
            echo "source_revision must exactly match the selected main revision." >&2
            exit 2
          fi
          if [[ "$(/usr/bin/git rev-parse HEAD)" != "$REQUESTED_REVISION" ]]; then
            echo "Checkout did not resolve the exact requested revision." >&2
            exit 2
          fi
          if [[ "$(/usr/bin/git rev-parse refs/remotes/origin/main)" != "$REQUESTED_REVISION" ]]; then
            echo "The requested revision is not the fetched origin/main tip." >&2
            exit 2
          fi
          /usr/bin/python3 -I - \
            mobile/config/staging.json \
            mobile/pubspec.yaml \
            "$RUNNER_TEMP/pakperk-mobile-source-binding.json" \
            "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import pathlib
          import re
          import stat
          import sys
          import urllib.parse

          def reject_duplicate_pairs(pairs):
              value = {}
              for key, child in pairs:
                  if key in value:
                      raise SystemExit("mobile/config/staging.json contains a duplicate key")
                  value[key] = child
              return value

          def reject_nonfinite_constant(_value):
              raise SystemExit("mobile/config/staging.json contains a non-finite number")

          config_path = pathlib.Path(sys.argv[1])
          pubspec_path = pathlib.Path(sys.argv[2])
          binding_path = pathlib.Path(sys.argv[3])
          github_output = pathlib.Path(sys.argv[4])
          metadata = os.lstat(config_path)
          if (
              not stat.S_ISREG(metadata.st_mode)
              or metadata.st_nlink != 1
              or metadata.st_size <= 0
              or metadata.st_size > 32 * 1024
          ):
              raise SystemExit("mobile/config/staging.json is not one bounded regular file")
          flags = os.O_RDONLY
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          descriptor = os.open(config_path, flags)
          try:
              before = os.fstat(descriptor)
              chunks = []
              remaining = 32 * 1024 + 1
              while remaining > 0:
                  chunk = os.read(descriptor, min(64 * 1024, remaining))
                  if not chunk:
                      break
                  chunks.append(chunk)
                  remaining -= len(chunk)
              data = b"".join(chunks)
              after = os.fstat(descriptor)
          finally:
              os.close(descriptor)
          current = os.lstat(config_path)
          identity = lambda value: (
              value.st_dev,
              value.st_ino,
              value.st_size,
              value.st_mtime_ns,
              value.st_ctime_ns,
          )
          if (
              identity(metadata) != identity(before)
              or identity(before) != identity(after)
              or identity(after) != identity(current)
              or len(data) != before.st_size
          ):
              raise SystemExit("mobile/config/staging.json changed while it was read")
          config = json.loads(
              data.decode("utf-8"),
              object_pairs_hook=reject_duplicate_pairs,
              parse_constant=reject_nonfinite_constant,
          )
          if config.get("PAKPERK_ENV") != "staging":
              raise SystemExit("mobile/config/staging.json must identify staging")
          if config.get("PAKPERK_FULLTEXT_POLICY") != "strict":
              raise SystemExit("staging mobile config must use strict full-text policy")
          api_origin = config.get("PAKPERK_API_BASE_URL")
          app_link_origin = config.get("PAKPERK_APP_LINK_ORIGIN")
          issuer = config.get("PAKPERK_OIDC_ISSUER_URL")
          client_id = config.get("PAKPERK_OIDC_CLIENT_ID")
          for label, value, allow_path in (
              ("staging API origin", api_origin, False),
              ("staging app-link origin", app_link_origin, False),
              ("staging OIDC issuer", issuer, True),
          ):
              if not isinstance(value, str):
                  raise SystemExit(f"{label} is unavailable")
              if (
                  len(value.encode("utf-8")) > 512
                  or any(ord(character) < 0x20 or ord(character) == 0x7f for character in value)
              ):
                  raise SystemExit(f"{label} contains unsupported characters")
              parsed = urllib.parse.urlsplit(value)
              try:
                  port = parsed.port
              except ValueError as error:
                  raise SystemExit(f"{label} has an invalid port") from error
              if (
                  parsed.scheme != "https"
                  or not parsed.hostname
                  or parsed.geturl() != value
                  or parsed.username is not None
                  or parsed.password is not None
                  or parsed.query
                  or parsed.fragment
                  or (port is not None and not 1 <= port <= 65535)
                  or (not allow_path and parsed.path not in {"", "/"})
              ):
                  raise SystemExit(f"{label} is not an exact safe HTTPS coordinate")
          if not isinstance(client_id, str) or re.fullmatch(r"[A-Za-z0-9._:-]{1,128}", client_id) is None:
              raise SystemExit("staging OIDC client ID is unavailable or invalid")

          matches = [
              re.fullmatch(
                  r"version: ((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]{1,32})?)\+([1-9][0-9]{0,9})",
                  line,
              )
              for line in pubspec_path.read_text(encoding="utf-8").splitlines()
              if line.startswith("version:")
          ]
          if len(matches) != 1 or matches[0] is None:
              raise SystemExit("mobile/pubspec.yaml must contain one bounded release version")
          match = matches[0]
          assert match is not None
          binding = {
              "api_origin": api_origin,
              "app_link_origin": app_link_origin,
              "app_version": match.group(1),
              "build_number": match.group(2),
              "environment": "staging",
              "oidc_client_id": client_id,
              "oidc_issuer": issuer,
              "schema": 2,
              "source_revision": os.environ["REQUESTED_REVISION"],
          }
          serialized = (
              json.dumps(
                  binding,
                  allow_nan=False,
                  ensure_ascii=True,
                  separators=(",", ":"),
                  sort_keys=True,
              )
              + "\n"
          ).encode("ascii")
          destination_flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          if hasattr(os, "O_CLOEXEC"):
              destination_flags |= os.O_CLOEXEC
          if hasattr(os, "O_NOFOLLOW"):
              destination_flags |= os.O_NOFOLLOW
          descriptor = os.open(binding_path, destination_flags, 0o600)
          try:
              view = memoryview(serialized)
              while view:
                  written = os.write(descriptor, view)
                  if written <= 0:
                      raise SystemExit("source binding write did not make progress")
                  view = view[written:]
              os.fsync(descriptor)
              written_metadata = os.fstat(descriptor)
          finally:
              os.close(descriptor)
          current = os.lstat(binding_path)
          if (
              not stat.S_ISREG(written_metadata.st_mode)
              or written_metadata.st_uid != os.getuid()
              or stat.S_IMODE(written_metadata.st_mode) != 0o600
              or written_metadata.st_nlink != 1
              or written_metadata.st_size != len(serialized)
              or identity(written_metadata) != identity(current)
          ):
              raise SystemExit("source binding is not one owner-only regular file")

          output_flags = os.O_WRONLY | os.O_APPEND
          if hasattr(os, "O_CLOEXEC"):
              output_flags |= os.O_CLOEXEC
          if hasattr(os, "O_NOFOLLOW"):
              output_flags |= os.O_NOFOLLOW
          output_descriptor = os.open(github_output, output_flags)
          try:
              output_metadata = os.fstat(output_descriptor)
              if not stat.S_ISREG(output_metadata.st_mode) or output_metadata.st_uid != os.getuid():
                  raise SystemExit("GitHub output file is not runner-owned and regular")
              output_bytes = (
                  f"app_version={match.group(1)}\n"
                  f"build_number={match.group(2)}\n"
                  f"source_binding={binding_path}\n"
              ).encode("ascii")
              view = memoryview(output_bytes)
              while view:
                  written = os.write(output_descriptor, view)
                  if written <= 0:
                      raise SystemExit("GitHub output write did not make progress")
                  view = view[written:]
              os.fsync(output_descriptor)
          finally:
              os.close(output_descriptor)
          PY

      - name: Verify protected macOS runner, pinned tools, and signed candidate manifest
        id: candidate
        shell: bash
        env:
          PAKPERK_APP_VERSION: ${{ steps.source.outputs.app_version }}
          PAKPERK_BUILD_NUMBER: ${{ steps.source.outputs.build_number }}
        run: |
          if [[ "$(/usr/bin/uname -s)" != "Darwin" ]]; then
            echo "Protected mobile acceptance requires a macOS runner." >&2
            exit 2
          fi
          for tool in python3 git xcrun; do
            if [[ "$(command -v "$tool")" != "/usr/bin/$tool" ]]; then
              echo "A required protected-runner tool did not resolve to /usr/bin." >&2
              exit 2
            fi
          done
          /usr/bin/python3 -I - <<'PY'
          import sys

          if sys.version_info < (3, 9):
              raise SystemExit("protected mobile acceptance requires Python 3.9 or newer")
          PY
          validator=/opt/pakperk/bin/pakperk-mobile-acceptance-validator.py
          driver=/opt/pakperk/bin/pakperk-mobile-acceptance-driver
          /usr/bin/python3 -I - \
            "$validator" "$VALIDATOR_SHA256" \
            "$driver" "$DRIVER_SHA256" <<'PY'
          import hashlib
          import os
          import pathlib
          import stat
          import sys

          validator_path = pathlib.Path(sys.argv[1])
          validator_digest = sys.argv[2]
          driver_path = pathlib.Path(sys.argv[3])
          driver_digest = sys.argv[4]
          for directory in (
              pathlib.Path("/"),
              pathlib.Path("/opt"),
              pathlib.Path("/opt/pakperk"),
              pathlib.Path("/opt/pakperk/bin"),
          ):
              metadata = os.lstat(directory)
              if (
                  not stat.S_ISDIR(metadata.st_mode)
                  or metadata.st_uid != 0
                  or metadata.st_mode & 0o022
              ):
                  raise SystemExit("a protected tooling parent is not immutable and root-owned")

          def verify(path, expected, label, require_executable):
              flags = os.O_RDONLY
              if hasattr(os, "O_CLOEXEC"):
                  flags |= os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags)
              try:
                  before = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(before.st_mode)
                      or before.st_uid != 0
                      or before.st_mode & 0o022
                      or before.st_nlink != 1
                      or (require_executable and before.st_mode & 0o111 == 0)
                  ):
                      raise SystemExit(f"protected {label} is not one immutable root-owned file")
                  digest_state = hashlib.sha256()
                  while True:
                      chunk = os.read(descriptor, 64 * 1024)
                      if not chunk:
                          break
                      digest_state.update(chunk)
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              current = os.lstat(path)
              identity = lambda value: (
                  value.st_dev,
                  value.st_ino,
                  value.st_size,
                  value.st_mtime_ns,
                  value.st_ctime_ns,
              )
              if identity(before) != identity(after) or identity(after) != identity(current):
                  raise SystemExit(f"protected {label} changed while being verified")
              if digest_state.hexdigest() != expected:
                  raise SystemExit(f"protected {label} digest mismatch")

          verify(validator_path, validator_digest, "acceptance validator", False)
          verify(driver_path, driver_digest, "acceptance driver", True)
          PY
          candidate_digest="${CANDIDATE_ID#sha256:}"
          provenance_digest="${PROVENANCE_ID#sha256:}"
          runner_session_digest="${RUNNER_SESSION_ID#sha256:}"
          candidate_manifest="/opt/pakperk/mobile-candidates/$candidate_digest.json"
          provenance_manifest="/opt/pakperk/mobile-release-provenance/$provenance_digest.json"
          runner_session_manifest="/opt/pakperk/mobile-runner-sessions/$runner_session_digest.json"
          binding_dir="$RUNNER_TEMP/pakperk-mobile-candidate-binding"
          candidate_binding="$binding_dir/candidate-binding.json"
          runner_session_binding="$binding_dir/runner-session-binding.json"
          umask 077
          mkdir "$binding_dir"
          /usr/bin/python3 -I "$validator" validate-candidate \
            --candidate-manifest "$candidate_manifest" \
            --provenance-manifest "$provenance_manifest" \
            --runner-session-manifest "$runner_session_manifest" \
            --source-revision "$REQUESTED_REVISION" \
            --candidate-id "$CANDIDATE_ID" \
            --provenance-id "$PROVENANCE_ID" \
            --runner-session-id "$RUNNER_SESSION_ID" \
            --app-version "$PAKPERK_APP_VERSION" \
            --build-number "$PAKPERK_BUILD_NUMBER" \
            --android-signer-sha256 "$ANDROID_SIGNER_SHA256" \
            --ios-team-id "$IOS_TEAM_ID" \
            --ios-signer-sha256 "$IOS_SIGNER_SHA256" \
            --binding-output "$candidate_binding" \
            --session-binding-output "$runner_session_binding"
          /usr/bin/python3 -I - \
            "$GITHUB_OUTPUT" \
            "$candidate_manifest" \
            "$provenance_manifest" \
            "$runner_session_manifest" \
            "$candidate_binding" \
            "$runner_session_binding" <<'PY'
          import datetime as dt
          import pathlib
          import secrets
          import sys

          destination = pathlib.Path(sys.argv[1])
          not_before = (
              dt.datetime.now(dt.timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          with destination.open("a", encoding="utf-8") as output:
              output.write(f"manifest={sys.argv[2]}\n")
              output.write(f"provenance_manifest={sys.argv[3]}\n")
              output.write(f"runner_session_manifest={sys.argv[4]}\n")
              output.write(f"binding={sys.argv[5]}\n")
              output.write(f"runner_session_binding={sys.argv[6]}\n")
              output.write(f"challenge={secrets.token_hex(32)}\n")
              output.write(f"not_before={not_before}\n")
          PY

      - name: Run complete protected physical-device acceptance
        id: acceptance
        continue-on-error: true
        shell: bash
        env:
          CANDIDATE_MANIFEST: ${{ steps.candidate.outputs.manifest }}
          PROVENANCE_MANIFEST: ${{ steps.candidate.outputs.provenance_manifest }}
          RUNNER_SESSION_MANIFEST: ${{ steps.candidate.outputs.runner_session_manifest }}
          CANDIDATE_BINDING: ${{ steps.candidate.outputs.binding }}
          RUNNER_SESSION_BINDING: ${{ steps.candidate.outputs.runner_session_binding }}
          RUN_CHALLENGE: ${{ steps.candidate.outputs.challenge }}
          RUN_NOT_BEFORE: ${{ steps.candidate.outputs.not_before }}
          RUN_ID_BINDING: ${{ github.run_id }}
          RUN_ATTEMPT_BINDING: ${{ github.run_attempt }}
          SOURCE_BINDING: ${{ steps.source.outputs.source_binding }}
          PAKPERK_APP_VERSION: ${{ steps.source.outputs.app_version }}
          PAKPERK_BUILD_NUMBER: ${{ steps.source.outputs.build_number }}
          BASH_ENV: /dev/null
          ENV: /dev/null
          PAKPERK_ANDROID_GESTURE_DEVICE_ID: ${{ secrets.PAKPERK_ANDROID_GESTURE_DEVICE_ID }}
          PAKPERK_ANDROID_THREE_BUTTON_DEVICE_ID: ${{ secrets.PAKPERK_ANDROID_THREE_BUTTON_DEVICE_ID }}
          PAKPERK_IOS_HOME_INDICATOR_DEVICE_ID: ${{ secrets.PAKPERK_IOS_HOME_INDICATOR_DEVICE_ID }}
          PAKPERK_IPAD_KEYBOARD_SECONDARY_SYNC_DEVICE_ID: ${{ secrets.PAKPERK_IPAD_KEYBOARD_SECONDARY_SYNC_DEVICE_ID }}
          PAKPERK_PRIMARY_TEST_ACCOUNT: ${{ secrets.PAKPERK_PRIMARY_TEST_ACCOUNT }}
          PAKPERK_PRIMARY_TEST_PASSWORD: ${{ secrets.PAKPERK_PRIMARY_TEST_PASSWORD }}
          PAKPERK_SECONDARY_TEST_ACCOUNT: ${{ secrets.PAKPERK_SECONDARY_TEST_ACCOUNT }}
          PAKPERK_SECONDARY_TEST_PASSWORD: ${{ secrets.PAKPERK_SECONDARY_TEST_PASSWORD }}
          PAKPERK_REPORT_TARGET_ACCOUNT: ${{ secrets.PAKPERK_REPORT_TARGET_ACCOUNT }}
        run: |
          evidence_dir="$RUNNER_TEMP/pakperk-mobile-acceptance-evidence"
          request="$RUNNER_TEMP/pakperk-mobile-acceptance-request.json"
          evidence="$evidence_dir/mobile-acceptance-evidence.json"
          private_dir="$RUNNER_TEMP/pakperk-mobile-acceptance-private"
          driver_log="$private_dir/driver.log"
          umask 077
          if [[ -e "$request" || -L "$request" || -e "$private_dir" || -L "$private_dir" ]]; then
            echo "Protected mobile acceptance temporary paths are not fresh." >&2
            exit 1
          fi
          mkdir "$evidence_dir"
          mkdir "$private_dir"
          /usr/bin/python3 -I - \
            "$request" \
            "$CANDIDATE_BINDING" \
            "$RUNNER_SESSION_BINDING" \
            "$SOURCE_BINDING" <<'PY'
          import json
          import os
          import pathlib
          import stat
          import sys

          def reject_duplicate_pairs(pairs):
              value = {}
              for key, child in pairs:
                  if key in value:
                      raise SystemExit("a protected request binding contains a duplicate key")
                  value[key] = child
              return value

          def reject_nonfinite_constant(_value):
              raise SystemExit("a protected request binding contains a non-finite number")

          def load(path, maximum, label):
              path = pathlib.Path(path)
              metadata = os.lstat(path)
              flags = os.O_RDONLY
              if hasattr(os, "O_CLOEXEC"):
                  flags |= os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags)
              try:
                  before = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(before.st_mode)
                      or before.st_uid != os.getuid()
                      or before.st_mode & 0o077
                      or before.st_nlink != 1
                      or before.st_size <= 0
                      or before.st_size > maximum
                  ):
                      raise SystemExit(f"{label} is not one bounded owner-only file")
                  chunks = []
                  remaining = maximum + 1
                  while remaining > 0:
                      chunk = os.read(descriptor, min(64 * 1024, remaining))
                      if not chunk:
                          break
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  data = b"".join(chunks)
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              current = os.lstat(path)
              identity = lambda value: (
                  value.st_dev,
                  value.st_ino,
                  value.st_size,
                  value.st_mtime_ns,
                  value.st_ctime_ns,
              )
              if (
                  identity(metadata) != identity(before)
                  or identity(before) != identity(after)
                  or identity(after) != identity(current)
                  or len(data) != before.st_size
              ):
                  raise SystemExit(f"{label} changed while it was read")
              value = json.loads(
                  data.decode("utf-8"),
                  object_pairs_hook=reject_duplicate_pairs,
                  parse_constant=reject_nonfinite_constant,
              )
              canonical = (
                  json.dumps(
                      value,
                      allow_nan=False,
                      ensure_ascii=True,
                      separators=(",", ":"),
                      sort_keys=True,
                  )
                  + "\n"
              ).encode("ascii")
              if data != canonical:
                  raise SystemExit(f"{label} is not exact canonical JSON")
              return value

          candidate_binding = load(sys.argv[2], 64 * 1024, "candidate binding")
          runner_session_binding = load(sys.argv[3], 32 * 1024, "runner-session binding")
          source_binding = load(sys.argv[4], 32 * 1024, "source binding")
          if set(source_binding) != {
              "api_origin",
              "app_link_origin",
              "app_version",
              "build_number",
              "environment",
              "oidc_client_id",
              "oidc_issuer",
              "schema",
              "source_revision",
          }:
              raise SystemExit("source binding does not match its closed key contract")
          if (
              source_binding["schema"] != 2
              or isinstance(source_binding["schema"], bool)
              or source_binding["source_revision"] != os.environ["REQUESTED_REVISION"]
              or source_binding["environment"] != "staging"
              or source_binding["app_version"] != os.environ["PAKPERK_APP_VERSION"]
              or source_binding["build_number"] != os.environ["PAKPERK_BUILD_NUMBER"]
          ):
              raise SystemExit("source binding identity does not match the protected run")
          if set(candidate_binding) != {
              "manifest_id",
              "provenance_id",
              "signed_workflow",
              "strict_full_text",
              "mobile_feature_evidence",
              "android",
              "ios",
          }:
              raise SystemExit("candidate binding does not match its closed key contract")
          mobile_feature_evidence = candidate_binding["mobile_feature_evidence"]
          if (
              not isinstance(mobile_feature_evidence, dict)
              or set(mobile_feature_evidence) != {
                  "schema",
                  "sha256",
                  "paperTitleSearch",
                  "libraryImportWrites",
                  "readingFeed",
                  "toReadFirstEnforcement",
                  "libraryV2",
                  "recommendations",
                  "recommendationEvents",
