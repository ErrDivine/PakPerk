              },
              "performance_metric_rules": {
                  "cold_cache_launch": {
                      "cached_first_readable_frame_p95_ms": ["range", 1, 1500],
                      "opening_transition_ms": ["range", 1, 700],
                  },
                  "plan03_reader_queue_and_large_document_safety": {
                      "large_document_fixture_blocks": ["eq", 2000, None],
                      "large_document_minimum_blocks_traversed_per_device": ["eq", 2000, None],
                      "large_document_minimum_pages_traversed_per_device": ["min", 20, None],
