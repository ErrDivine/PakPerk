name: signed-mobile-release

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Reviewed full commit SHA reachable from main
        required: true
        type: string
      environment:
        description: Protected release environment
        required: true
        type: choice
        options: [development, staging, production]
      upload_to_stores:
        description: Upload the verified candidate to TestFlight and Google Play internal track
        required: true
        default: false
        type: boolean
      previous_android_version_code:
        description: Highest version code already uploaded in this Play application
        required: true
        default: "1"
        type: string
      previous_ios_build_number:
        description: Highest build number already uploaded in this App Store application
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: signed-mobile-${{ inputs.environment }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.8
  PAKPERK_RUBY_ENGINE: ruby
  PAKPERK_RUBY_VERSION: 3.4.10
  PAKPERK_RUBYGEMS_VERSION: 4.0.17
  BUNDLER_VERSION: 2.6.9
  BUNDLER_SHA256: a25675ffbd055ae1186766cc1e120b4cf62588e88abb59b99c57e22b1c55c9eb
  PAKPERK_JDK_RUNTIME_VERSION: 17.0.19+10
  PAKPERK_JDK_VENDOR: Eclipse Adoptium
  XCODE_VERSION: "26.6"
  XCODE_BUILD: "17F113"

jobs:
  signed-candidate:
    name: ${{ inputs.environment }} signed candidate
    runs-on: macos-26
    timeout-minutes: 150
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve reviewed source revision
        id: source
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTED_REVISION: ${{ inputs.source_revision }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Signed-mobile release must be dispatched from main." >&2
            exit 2
          fi
          if [[ "$RELEASE_ENVIRONMENT" != "development" && "$RELEASE_ENVIRONMENT" != "staging" && "$RELEASE_ENVIRONMENT" != "production" ]]; then
            echo "Signed-mobile environment must be development, staging, or production." >&2
            exit 2
          fi
          if ! [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_revision must be a full lowercase Git commit SHA." >&2
            exit 1
          fi
          source_revision="$(git rev-parse HEAD)"
          if [[ "$source_revision" != "$REQUESTED_REVISION" ]]; then
            echo "Checkout did not resolve the exact requested revision." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$source_revision" origin/main; then
            echo "The mobile release revision is not reachable from origin/main." >&2
            exit 1
          fi
          printf 'source_revision=%s\n' "$source_revision" >>"$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify and record the exact reviewed Flutter SDK
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          flutter --version --machine >"$RUNNER_TEMP/evidence/flutter-toolchain.json"
          python3 scripts/validate_flutter_toolchain.py \
            "$RUNNER_TEMP/evidence/flutter-toolchain.json"

      - name: Select and verify the reviewed Android JDK
        shell: bash
        run: |
          reviewed_java_home="${JAVA_HOME_17_arm64:-}"
          if [[ -z "$reviewed_java_home" || ! -x "$reviewed_java_home/bin/java" ]]; then
            echo "The arm64 macOS 26 runner does not expose JAVA_HOME_17_arm64." >&2
            exit 1
          fi
          java_properties="$("$reviewed_java_home/bin/java" -XshowSettings:properties -version 2>&1)"
          runtime_version="$(awk -F' = ' '$1 ~ /^[[:space:]]*java.runtime.version$/ { print $2; exit }' <<<"$java_properties")"
          java_vendor="$(awk -F' = ' '$1 ~ /^[[:space:]]*java.vendor$/ { print $2; exit }' <<<"$java_properties")"
          if [[ "$runtime_version" != "$PAKPERK_JDK_RUNTIME_VERSION" || "$java_vendor" != "$PAKPERK_JDK_VENDOR" ]]; then
            echo "The runner JDK does not match reviewed Temurin $PAKPERK_JDK_RUNTIME_VERSION." >&2
            exit 1
          fi
          printf 'JAVA_HOME=%s\n' "$reviewed_java_home" >>"$GITHUB_ENV"
          printf '%s/bin\n' "$reviewed_java_home" >>"$GITHUB_PATH"

      - name: Select, verify, and record the reviewed Ruby runtime
        shell: bash
        run: |
          ruby_engine="$(ruby -e 'print RUBY_ENGINE')"
          ruby_version="$(ruby -e 'print RUBY_VERSION')"
          if [[ "$ruby_engine" != "$PAKPERK_RUBY_ENGINE" || \
                "$ruby_version" != "$PAKPERK_RUBY_VERSION" ]]; then
            echo "The runner Ruby runtime does not match reviewed MRI $PAKPERK_RUBY_VERSION." >&2
            exit 1
          fi
          rubygems_version="$(gem --version)"
          if [[ "$rubygems_version" != "$PAKPERK_RUBYGEMS_VERSION" ]]; then
            echo "The runner RubyGems does not match reviewed version $PAKPERK_RUBYGEMS_VERSION." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            printf 'ruby_engine=%s\n' "$ruby_engine"
            printf 'ruby_version=%s\n' "$ruby_version"
            printf 'rubygems_version=%s\n' "$rubygems_version"
            printf 'ruby_executable=%s\n' "$(command -v ruby)"
            ruby --version
          } >"$RUNNER_TEMP/evidence/ruby-toolchain.txt"

      - name: Resolve and cross-check release identity
        id: release
        shell: bash
        run: |
          mobile_version="$(awk '$1 == "version:" { print $2; exit }' mobile/pubspec.yaml)"
          version_name="${mobile_version%%+*}"
          build_number="${mobile_version##*+}"
          backend_version="$(awk '/^\[workspace.package\]$/ { section=1; next } section && /^version = / { gsub(/[\" ]/, "", $3); print $3; exit }' backend/Cargo.toml)"
          helm_app_version="$(awk '$1 == "appVersion:" { gsub(/\"/, "", $2); print $2; exit }' deploy/helm/pakperk/Chart.yaml)"
          if [[ "$mobile_version" != *+* || ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "mobile/pubspec.yaml must contain a positive store build number." >&2
            exit 1
          fi
          if [[ "$version_name" != "$backend_version" || "$version_name" != "$helm_app_version" ]]; then
            echo "Mobile, Rust workspace, and Helm app versions must match." >&2
            exit 1
          fi
          case "${{ inputs.environment }}" in
            development)
              flavor=dev
              bundle_id=app.pakperk.pakperk.dev
              callback_scheme=pakperk-auth-dev
              app_link_host=-
              android_app_link_host=localhost
              android_version_name="$version_name-dev"
              ;;
            staging)
              flavor=staging
              bundle_id=app.pakperk.pakperk.staging
              callback_scheme=pakperk-auth-staging
              app_link_host=staging.pakperk.app
              android_app_link_host="$app_link_host"
              android_version_name="$version_name-staging"
              ;;
            production)
              flavor=prod
              bundle_id=app.pakperk.pakperk
              callback_scheme=pakperk-auth
              app_link_host=pakperk.app
              android_app_link_host="$app_link_host"
              android_version_name="$version_name"
              ;;
            *) exit 2 ;;
          esac
          for pair in \
            "flavor=$flavor" \
            "bundle_id=$bundle_id" \
            "callback_scheme=$callback_scheme" \
            "app_link_host=$app_link_host" \
            "android_app_link_host=$android_app_link_host" \
            "version_name=$version_name" \
            "android_version_name=$android_version_name" \
            "build_number=$build_number"; do
            echo "$pair" >>"$GITHUB_OUTPUT"
          done

      - name: Materialize protected mobile feature flags
        shell: bash
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_FLAVOR: ${{ steps.release.outputs.flavor }}
          RELEASE_ACCOUNTS_ENABLED: ${{ vars.PAKPERK_ACCOUNTS_ENABLED }}
          RELEASE_LIBRARY_ENABLED: ${{ vars.PAKPERK_LIBRARY_ENABLED }}
          RELEASE_COMMENTS_ENABLED: ${{ vars.PAKPERK_COMMENTS_ENABLED }}
          RELEASE_DOCUMENT_VERSION: ${{ vars.PAKPERK_PUBLIC_DOCUMENT_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          source = root / "mobile" / "config" / f"{os.environ['RELEASE_FLAVOR']}.json"
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mobile-release-config.json"
          evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / "evidence" / "mobile-feature-flags.json"
          config = json.loads(source.read_text(encoding="utf-8"))

          if os.environ["RELEASE_ENVIRONMENT"] != "development":
              expected_document_version = os.environ.get("RELEASE_DOCUMENT_VERSION", "")
              if not expected_document_version:
                  raise SystemExit(
                      "Protected PAKPERK_PUBLIC_DOCUMENT_VERSION is required"
                  )
              if any(
                  config[key] != expected_document_version
                  for key in (
                      "PAKPERK_TERMS_DOCUMENT_VERSION",
                      "PAKPERK_COMMUNITY_GUIDELINES_DOCUMENT_VERSION",
                  )
              ):
                  raise SystemExit(
                      "Bundled mobile policies do not match the protected public document version"
                  )
              protected = {}
              for short_name, config_name in (
                  ("ACCOUNTS", "PAKPERK_ACCOUNTS_ENABLED"),
                  ("LIBRARY", "PAKPERK_LIBRARY_ENABLED"),
                  ("COMMENTS", "PAKPERK_COMMENTS_ENABLED"),
              ):
                  raw = os.environ.get(f"RELEASE_{short_name}_ENABLED", "") or "false"
                  if raw not in {"true", "false"}:
                      raise SystemExit(
                          f"Protected PAKPERK_{short_name}_ENABLED must be exactly true or false"
                      )
                  protected[config_name] = raw
              if protected["PAKPERK_LIBRARY_ENABLED"] == "true" and protected["PAKPERK_ACCOUNTS_ENABLED"] != "true":
                  raise SystemExit("Protected mobile library requires accounts")
              if protected["PAKPERK_COMMENTS_ENABLED"] == "true" and protected["PAKPERK_ACCOUNTS_ENABLED"] != "true":
                  raise SystemExit("Protected mobile comments require accounts")
              config.update(protected)

          destination.write_text(
              json.dumps(config, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          evidence.write_text(
              json.dumps(
                  {
                      "schema": 2,
                      "environment": os.environ["RELEASE_ENVIRONMENT"],
                      "accounts": config["PAKPERK_ACCOUNTS_ENABLED"] == "true",
                      "library": config["PAKPERK_LIBRARY_ENABLED"] == "true",
                      "comments": config["PAKPERK_COMMENTS_ENABLED"] == "true",
                      "termsDocumentVersion": config["PAKPERK_TERMS_DOCUMENT_VERSION"],
                      "communityGuidelinesDocumentVersion": config["PAKPERK_COMMUNITY_GUIDELINES_DOCUMENT_VERSION"],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"PAKPERK_MOBILE_RELEASE_CONFIG={destination}\n")
          PY

      - name: Validate protected inputs and monotonic store builds
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.PAKPERK_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.PAKPERK_ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.PAKPERK_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PAKPERK_ANDROID_KEY_PASSWORD }}
          ANDROID_APP_SIGNING_SHA256: ${{ secrets.PAKPERK_ANDROID_APP_SIGNING_SHA256 }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.PAKPERK_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.PAKPERK_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.PAKPERK_IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.PAKPERK_DEVELOPMENT_TEAM }}
          IOS_PROFILE_NAME: ${{ secrets.PAKPERK_IOS_PROVISIONING_PROFILE_SPECIFIER }}
          GOOGLE_PLAY_JSON_BASE64: ${{ secrets.PAKPERK_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          APP_STORE_ISSUER_ID: ${{ secrets.PAKPERK_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_KEY_ID: ${{ secrets.PAKPERK_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_KEY_BASE64: ${{ secrets.PAKPERK_APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          PREVIOUS_ANDROID_VERSION_CODE: ${{ inputs.previous_android_version_code }}
          PREVIOUS_IOS_BUILD_NUMBER: ${{ inputs.previous_ios_build_number }}
          RELEASE_BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: |
          required=(
            ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD
            IOS_PROFILE_BASE64 IOS_TEAM_ID IOS_PROFILE_NAME
          )
          if [[ "${{ inputs.environment }}" != development ]]; then
            required+=(ANDROID_APP_SIGNING_SHA256)
          fi
          if [[ "${{ inputs.upload_to_stores }}" == true ]]; then
            required+=(GOOGLE_PLAY_JSON_BASE64 APP_STORE_ISSUER_ID APP_STORE_KEY_ID APP_STORE_KEY_BASE64)
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Protected environment input is missing: $name" >&2
              exit 1
            fi
            if [[ "${!name}" == *$'\n'* || "${!name}" == *$'\r'* ]]; then
              echo "Protected scalar input contains a line break: $name" >&2
              exit 1
            fi
          done
          if [[ "${{ inputs.environment }}" != development ]] && \
             ! [[ "$ANDROID_APP_SIGNING_SHA256" =~ ^([A-F0-9]{2}:){31}[A-F0-9]{2}$ ]]; then
            echo "The Play app-signing SHA-256 fingerprint has an invalid format." >&2
            exit 1
          fi
          if [[ "${{ inputs.upload_to_stores }}" == true ]] && {
            ! [[ "$APP_STORE_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]] ||
            ! [[ "$APP_STORE_KEY_ID" =~ ^[A-Z0-9]{10}$ ]];
          }; then
            echo "App Store Connect issuer/key identifiers have an invalid format." >&2
            exit 1
          fi
          if ! [[ "$PREVIOUS_ANDROID_VERSION_CODE" =~ ^[0-9]+$ ]] || \
             ! [[ "$PREVIOUS_IOS_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Previous store build inputs must be non-negative integers." >&2
            exit 1
          fi
          if (( RELEASE_BUILD_NUMBER <= PREVIOUS_ANDROID_VERSION_CODE )) || \
             (( RELEASE_BUILD_NUMBER <= PREVIOUS_IOS_BUILD_NUMBER )); then
            echo "The checked-in build number is not newer than both confirmed store builds." >&2
            exit 1
          fi

      - name: Resolve locked Flutter dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Gate candidate on Dart formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed .

      - name: Gate candidate on Flutter analysis
        working-directory: mobile
        run: flutter analyze

      - name: Gate candidate on the complete Flutter test suite
        working-directory: mobile
        run: flutter test

      - name: Gate Apple SDK and capture exact build toolchain
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 scripts/validate_gradle_wrapper.py
          python3 scripts/validate_gradle_verification.py
          xcode_developer_dir="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [[ ! -d "$xcode_developer_dir" ]]; then
            echo "Required Xcode $XCODE_VERSION is absent from the pinned runner image." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_developer_dir"
          xcode_version="$(xcodebuild -version | awk '$1 == "Xcode" { print $2; exit }')"
          xcode_build="$(xcodebuild -version | awk '$1 == "Build" && $2 == "version" { print $3; exit }')"
          iphoneos_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          if ! [[ "$xcode_version" =~ ^[0-9]+([.][0-9]+)*$ ]] || \
             ! [[ "$iphoneos_sdk" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
            echo "Could not parse the Xcode/iPhoneOS SDK versions." >&2
            exit 1
          fi
          if [[ "$xcode_version" != "$XCODE_VERSION" || "$xcode_build" != "$XCODE_BUILD" ]] || \
             (( ${iphoneos_sdk%%.*} < 26 )); then
            echo "App Store candidates require the reviewed Xcode build and iOS 26+ SDK." >&2
            exit 1
          fi
          {
            printf 'github_runner_image=%s\n' "${ImageOS:-unknown}"
            printf 'github_runner_version=%s\n' "${ImageVersion:-unknown}"
            sw_vers
            uname -m
            xcode-select -p
            xcodebuild -version
            printf 'iphoneos_sdk=%s\n' "$iphoneos_sdk"
            dart --version 2>&1
            java -version 2>&1
            ruby --version
            gem --version
            (cd mobile/android && ./gradlew --no-daemon --version)
          } >"$RUNNER_TEMP/evidence/native-toolchain.txt"

      - name: Materialize Android upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.PAKPERK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "pakperk-upload.jks").write_bytes(
              base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          )
          PY
          chmod 0600 "$RUNNER_TEMP/pakperk-upload.jks"

      - name: Build and inspect signed Android artifacts
        id: android
        shell: bash
        working-directory: mobile
        env:
          PAKPERK_ANDROID_STORE_FILE: ${{ runner.temp }}/pakperk-upload.jks
          PAKPERK_ANDROID_STORE_PASSWORD: ${{ secrets.PAKPERK_ANDROID_STORE_PASSWORD }}
          PAKPERK_ANDROID_KEY_ALIAS: ${{ secrets.PAKPERK_ANDROID_KEY_ALIAS }}
          PAKPERK_ANDROID_KEY_PASSWORD: ${{ secrets.PAKPERK_ANDROID_KEY_PASSWORD }}
          ANDROID_APP_SIGNING_SHA256: ${{ secrets.PAKPERK_ANDROID_APP_SIGNING_SHA256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/symbols/android-aab" "$RUNNER_TEMP/symbols/android-apk" "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/artifacts"
          flutter build appbundle --release --flavor "${{ steps.release.outputs.flavor }}" \
            --dart-define-from-file="$PAKPERK_MOBILE_RELEASE_CONFIG" \
            --obfuscate --split-debug-info="$RUNNER_TEMP/symbols/android-aab"
          flutter build apk --release --flavor "${{ steps.release.outputs.flavor }}" \
            --dart-define-from-file="$PAKPERK_MOBILE_RELEASE_CONFIG" \
            --obfuscate --split-debug-info="$RUNNER_TEMP/symbols/android-apk"
          aab="build/app/outputs/bundle/${{ steps.release.outputs.flavor }}Release/app-${{ steps.release.outputs.flavor }}-release.aab"
          apk="build/app/outputs/flutter-apk/app-${{ steps.release.outputs.flavor }}-release.apk"
          retained_aab="$RUNNER_TEMP/artifacts/${aab##*/}"
          retained_apk="$RUNNER_TEMP/artifacts/${apk##*/}"
          if [[ -e "$retained_aab" || -L "$retained_aab" || -e "$retained_apk" || -L "$retained_apk" ]]; then
            echo "Retained Android artifact destinations must not pre-exist." >&2
            exit 1
          fi
          cp "$aab" "$retained_aab"
          cp "$apk" "$retained_apk"
          chmod 0400 "$retained_aab" "$retained_apk"
          "$GITHUB_WORKSPACE/scripts/verify_android_release_artifacts.sh" \
            "$retained_aab" "$retained_apk" "${{ steps.release.outputs.bundle_id }}" \
            "${{ steps.release.outputs.android_version_name }}" "${{ steps.release.outputs.build_number }}" \
            "${{ steps.release.outputs.callback_scheme }}" \
            "${{ steps.release.outputs.android_app_link_host }}" \
            | tee "$RUNNER_TEMP/evidence/android-upload-identity.txt"
          if [[ "${{ inputs.environment }}" != development ]]; then
            dart run tool/verify_strict_artifact_assets.dart "$retained_aab"
            dart run tool/verify_strict_artifact_assets.dart "$retained_apk"
            printf 'android_play_app_signing_sha256=%s\n' "$ANDROID_APP_SIGNING_SHA256" \
              >"$RUNNER_TEMP/evidence/android-installed-identity.txt"
          fi
          python3 - "$retained_aab" "$retained_apk" \
            "$RUNNER_TEMP/evidence/android-retained-digests.txt" <<'PY'
          import hashlib
          import os
          import pathlib
          import stat
          import sys

          def digest(path):
              metadata = os.lstat(path)
              if (
                  not stat.S_ISREG(metadata.st_mode)
                  or metadata.st_nlink != 1
                  or metadata.st_size <= 0
                  or metadata.st_size > 8 * 1024**3
              ):
                  raise SystemExit("retained Android artifact is not one bounded regular file")
              descriptor = os.open(path, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
              value = hashlib.sha256()
              try:
                  before = os.fstat(descriptor)
                  while True:
                      chunk = os.read(descriptor, 1024 * 1024)
                      if not chunk:
                          break
                      value.update(chunk)
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              identity = lambda item: (
                  item.st_dev,
                  item.st_ino,
                  item.st_size,
                  item.st_mtime_ns,
                  item.st_ctime_ns,
              )
              if identity(metadata) != identity(before) or identity(before) != identity(after):
                  raise SystemExit("retained Android artifact changed while it was hashed")
              return value.hexdigest()

          output = pathlib.Path(sys.argv[3])
          with output.open("x", encoding="ascii") as handle:
              handle.write(f"android_aab_artifact_sha256={digest(sys.argv[1])}\n")
              handle.write(f"android_apk_artifact_sha256={digest(sys.argv[2])}\n")
          PY

      - name: Generate and validate the exact native Android runtime SBOM
        working-directory: mobile/android
        env:
          PAKPERK_ANDROID_SBOM_FLAVOR: ${{ steps.release.outputs.flavor }}
        run: |
          ./gradlew :app:cyclonedxDirectBom \
            --init-script ../../scripts/cyclonedx-gradle.init.gradle.kts \
            --no-daemon
          python3 ../../scripts/validate_android_native_sbom.py \
            ../build/app/reports/cyclonedx-direct/bom.json
          cp ../build/app/reports/cyclonedx-direct/bom.json \
            "$RUNNER_TEMP/evidence/android-native.cdx.json"

      - name: Import protected Apple signing identity and profile
        id: apple_signing
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.PAKPERK_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.PAKPERK_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.PAKPERK_IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.PAKPERK_DEVELOPMENT_TEAM }}
          IOS_PROFILE_NAME: ${{ secrets.PAKPERK_IOS_PROVISIONING_PROFILE_SPECIFIER }}
          EXPECTED_BUNDLE_ID: ${{ steps.release.outputs.bundle_id }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          root.joinpath("distribution.p12").write_bytes(base64.b64decode(os.environ["IOS_CERTIFICATE_BASE64"], validate=True))
          root.joinpath("profile.mobileprovision").write_bytes(base64.b64decode(os.environ["IOS_PROFILE_BASE64"], validate=True))
          PY
          chmod 0600 "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision"
          keychain_password="$(openssl rand -hex 32)"
          keychain="$RUNNER_TEMP/pakperk-release.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" \
            -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" >"$RUNNER_TEMP/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          if ! [[ "$profile_uuid" =~ ^[A-Fa-f0-9-]{36}$ ]] || \
             ! [[ "$IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || \
             ! [[ "$IOS_PROFILE_NAME" =~ ^[A-Za-z0-9._\ -]{1,128}$ ]]; then
            echo "Protected Apple signing identifiers have an invalid format." >&2
            exit 1
          fi
          if [[ "$profile_name" != "$IOS_PROFILE_NAME" || "$profile_team" != "$IOS_TEAM_ID" || \
                "$profile_app_id" != "$IOS_TEAM_ID.$EXPECTED_BUNDLE_ID" ]]; then
            echo "Protected provisioning profile does not match this environment." >&2
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "profile_uuid=$profile_uuid" >>"$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os, pathlib, plistlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          pathlib.Path("mobile/ios/Flutter/LocalSigning.xcconfig").write_text(
              "PAKPERK_DEVELOPMENT_TEAM = " + os.environ["IOS_TEAM_ID"] + "\n"
              "CODE_SIGN_STYLE = Manual\n"
              "CODE_SIGN_IDENTITY = Apple Distribution\n"
              "PROVISIONING_PROFILE_SPECIFIER = " + os.environ["IOS_PROFILE_NAME"] + "\n",
              encoding="utf-8",
          )
          with root.joinpath("ExportOptions.plist").open("wb") as handle:
              plistlib.dump({
                  "method": "app-store-connect",
                  "signingStyle": "manual",
                  "teamID": os.environ["IOS_TEAM_ID"],
                  "provisioningProfiles": {
                      os.environ["EXPECTED_BUNDLE_ID"]: os.environ["IOS_PROFILE_NAME"],
                  },
                  "manageAppVersionAndBuildNumber": False,
                  "uploadSymbols": False,
              }, handle)
          PY

      - name: Build and inspect signed iOS artifact
        id: ios
        shell: bash
        working-directory: mobile
        run: |
          mkdir -p "$RUNNER_TEMP/symbols/ios" "$RUNNER_TEMP/native-symbols"
          flutter build ipa --release --flavor "${{ steps.release.outputs.flavor }}" \
            --dart-define-from-file="$PAKPERK_MOBILE_RELEASE_CONFIG" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --obfuscate --split-debug-info="$RUNNER_TEMP/symbols/ios"
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [[ ${#ipas[@]} -ne 1 ]]; then
            echo "Expected exactly one signed IPA, found ${#ipas[@]}." >&2
            exit 1
          fi
          ipa="${ipas[0]}"
          retained_ipa="$RUNNER_TEMP/artifacts/${ipa##*/}"
          if [[ -e "$retained_ipa" || -L "$retained_ipa" ]]; then
            echo "Retained iOS artifact destination must not pre-exist." >&2
            exit 1
          fi
          cp "$ipa" "$retained_ipa"
          chmod 0400 "$retained_ipa"
          "$GITHUB_WORKSPACE/scripts/verify_ios_release_artifact.sh" \
            "$retained_ipa" "${{ steps.release.outputs.bundle_id }}" \
            "${{ steps.release.outputs.version_name }}" "${{ steps.release.outputs.build_number }}" \
            "${{ steps.release.outputs.callback_scheme }}" "${{ steps.release.outputs.app_link_host }}" \
            | tee "$RUNNER_TEMP/evidence/apple-installed-identity.txt"
          if [[ "${{ inputs.environment }}" != development ]]; then
            dart run tool/verify_strict_artifact_assets.dart "$retained_ipa"
          fi
          find build/ios/archive -type d -name '*.dSYM' \
            -exec cp -R '{}' "$RUNNER_TEMP/native-symbols/" ';'

      - name: Verify deployed association documents against installed-app identities
        if: inputs.environment != 'development'
        shell: bash
        env:
          ANDROID_APP_SIGNING_SHA256: ${{ secrets.PAKPERK_ANDROID_APP_SIGNING_SHA256 }}
        run: |
          host="${{ steps.release.outputs.app_link_host }}"
          for document in assetlinks.json apple-app-site-association; do
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --max-redirs 0 --connect-timeout 5 --max-time 15 \
              --dump-header "$RUNNER_TEMP/evidence/$document.headers" \
              --output "$RUNNER_TEMP/evidence/$document" \
              "https://$host/.well-known/$document"
            if ! grep -Eiq '^content-type:[[:space:]]*application/json([[:space:]]*;|[[:space:]]*$)' \
              "$RUNNER_TEMP/evidence/$document.headers"; then
              echo "$document was not served as application/json." >&2
              exit 1
            fi
          done
          apple_team_id="$(sed -n 's/^apple_team_id=//p' "$RUNNER_TEMP/evidence/apple-installed-identity.txt")"
          PAKPERK_RELEASE_ENV="${{ inputs.environment }}" \
          PAKPERK_ANDROID_PACKAGE="${{ steps.release.outputs.bundle_id }}" \
          PAKPERK_ANDROID_SHA256="$ANDROID_APP_SIGNING_SHA256" \
          PAKPERK_APPLE_TEAM_ID="$apple_team_id" \
          PAKPERK_APPLE_BUNDLE_ID="${{ steps.release.outputs.bundle_id }}" \
            ./scripts/verify_mobile_associations.sh \
              "$RUNNER_TEMP/evidence/assetlinks.json" \
              "$RUNNER_TEMP/evidence/apple-app-site-association"

      - name: Install and record the pinned store upload client
        if: inputs.upload_to_stores
        shell: bash
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          python3 scripts/validate_fastlane_lock.py
          bundler_gem="$RUNNER_TEMP/bundler-$BUNDLER_VERSION.gem"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$bundler_gem" \
            "https://rubygems.org/downloads/bundler-$BUNDLER_VERSION.gem"
          printf '%s  %s\n' "$BUNDLER_SHA256" "$bundler_gem" | shasum -a 256 --check
          gem install --user-install --local "$bundler_gem" --no-document
          bundle_bin="$(ruby -e 'print Gem.user_dir')/bin/bundle"
          export BUNDLE_GEMFILE="$GITHUB_WORKSPACE/mobile/Gemfile"
          export BUNDLE_PATH="$RUNNER_TEMP/fastlane-bundle"
          export BUNDLE_FROZEN=true
          export BUNDLE_LOCKFILE_CHECKSUMS=true
          "$bundle_bin" "_${BUNDLER_VERSION}_" install --jobs 4 --retry 3
          {
            printf 'PAKPERK_BUNDLE_BIN=%s\n' "$bundle_bin"
            printf 'BUNDLE_GEMFILE=%s\n' "$BUNDLE_GEMFILE"
            printf 'BUNDLE_PATH=%s\n' "$BUNDLE_PATH"
            printf 'BUNDLE_FROZEN=true\n'
            printf 'BUNDLE_LOCKFILE_CHECKSUMS=true\n'
          } >>"$GITHUB_ENV"
          "$bundle_bin" "_${BUNDLER_VERSION}_" exec fastlane --version \
            >"$RUNNER_TEMP/evidence/fastlane.txt" 2>&1
          "$bundle_bin" "_${BUNDLER_VERSION}_" list \
            >"$RUNNER_TEMP/evidence/ruby-gems.txt"
          cp mobile/Gemfile.lock "$RUNNER_TEMP/evidence/fastlane-Gemfile.lock"

      - name: Generate SBOM, notices, and immutable evidence hashes
        id: manifests
        shell: bash
        env:
          RELEASE_SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_APP_VERSION: ${{ steps.release.outputs.version_name }}
          RELEASE_ANDROID_VERSION_NAME: ${{ steps.release.outputs.android_version_name }}
          RELEASE_BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          RELEASE_APPLICATION_ID: ${{ steps.release.outputs.bundle_id }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_JOB: ${{ github.job }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SOURCE_REVISION" ]] || \
             ! git diff --quiet --ignore-submodules -- || \
             ! git diff --cached --quiet --ignore-submodules --; then
            echo "Tracked release source changed before candidate provenance generation." >&2
            exit 1
          fi
          source_epoch="$(git show -s --format=%ct HEAD)"
          SOURCE_REVISION="${{ steps.source.outputs.source_revision }}" SOURCE_DATE_EPOCH="$source_epoch" \
            ./scripts/generate_release_metadata.py \
              --flutter-sdk-version "$FLUTTER_VERSION" \
              --output-dir "$RUNNER_TEMP/evidence/release-metadata"
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import re
          import stat

          root = pathlib.Path(os.environ["RUNNER_TEMP"])

          def fail(message):
              raise SystemExit(message)

          release_roots = {}
          for name in ("artifacts", "symbols", "native-symbols", "evidence"):
              path = root / name
              metadata = os.lstat(path)
              if not stat.S_ISDIR(metadata.st_mode):
                  fail(f"release evidence root is not a real directory: {name}")
              release_roots[name] = path

          def artifact(suffix):
              matches = sorted(root.joinpath("artifacts").glob(f"*{suffix}"))
              if len(matches) != 1:
                  fail(f"expected exactly one retained {suffix} artifact")
              path = matches[0]
              metadata = os.lstat(path)
              if (
                  not stat.S_ISREG(metadata.st_mode)
                  or metadata.st_nlink != 1
                  or metadata.st_size <= 0
                  or metadata.st_size > 8 * 1024**3
              ):
                  fail(f"retained {suffix} artifact is not one bounded regular file")
              digest = hashlib.sha256()
              flags = os.O_RDONLY
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags)
              try:
                  before = os.fstat(descriptor)
                  while True:
                      chunk = os.read(descriptor, 1024 * 1024)
                      if not chunk:
                          break
                      digest.update(chunk)
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              identity = lambda value: (
                  value.st_dev,
                  value.st_ino,
                  value.st_size,
                  value.st_mtime_ns,
                  value.st_ctime_ns,
              )
              if identity(before) != identity(after) or identity(metadata) != identity(before):
                  fail(f"retained {suffix} artifact changed while it was hashed")
              return digest.hexdigest()

          def identity_file(name):
              path = root / "evidence" / name
              metadata = os.lstat(path)
              if (
                  not stat.S_ISREG(metadata.st_mode)
                  or metadata.st_nlink != 1
                  or metadata.st_size <= 0
                  or metadata.st_size > 64 * 1024
              ):
                  fail("release identity evidence is not one bounded regular file")
              descriptor = os.open(
                  path, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0)
              )
              data = bytearray()
              try:
                  before = os.fstat(descriptor)
                  while True:
                      chunk = os.read(descriptor, 64 * 1024)
                      if not chunk:
                          break
                      data.extend(chunk)
                      if len(data) > 64 * 1024:
                          fail("release identity evidence exceeded its read budget")
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              identity = lambda value: (
                  value.st_dev,
                  value.st_ino,
                  value.st_size,
                  value.st_mtime_ns,
                  value.st_ctime_ns,
              )
              if identity(metadata) != identity(before) or identity(before) != identity(after):
                  fail("release identity evidence changed while it was read")
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  fail("release identity evidence is not UTF-8")
              values = {}
              for line in text.splitlines():
                  key, separator, value = line.partition("=")
                  if (
                      separator != "="
                      or re.fullmatch(r"[a-z][a-z0-9_]{0,63}", key) is None
                      or not value
                      or key in values
                  ):
                      fail("release identity evidence is malformed or duplicated")
                  values[key] = value
              return values

          def exact_environment(name, pattern):
              value = os.environ[name]
              if re.fullmatch(pattern, value) is None:
                  fail(f"{name} is outside its closed format")
              return value

          source_revision = exact_environment("RELEASE_SOURCE_REVISION", r"[0-9a-f]{40}")
          environment = exact_environment(
              "RELEASE_ENVIRONMENT", r"development|staging|production"
          )
          app_version = exact_environment(
              "RELEASE_APP_VERSION",
              r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]{1,32})?",
          )
          android_version_name = exact_environment(
              "RELEASE_ANDROID_VERSION_NAME", r"[0-9A-Za-z][0-9A-Za-z._+-]{0,63}"
          )
          build_number = exact_environment("RELEASE_BUILD_NUMBER", r"[1-9][0-9]{0,9}")
          application_id = exact_environment(
              "RELEASE_APPLICATION_ID",
              r"[A-Za-z][A-Za-z0-9_-]{0,62}(?:\.[A-Za-z][A-Za-z0-9_-]{0,62}){1,9}",
          )
          workflow_sha = exact_environment("RELEASE_WORKFLOW_SHA", r"[0-9a-f]{40}")
          repository = exact_environment(
              "RELEASE_REPOSITORY", r"[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}"
          )
          if os.environ["RELEASE_JOB"] != "signed-candidate":
              fail("release provenance job identity is invalid")
          run_id = exact_environment("RELEASE_RUN_ID", r"[1-9][0-9]{0,19}")
          run_attempt = exact_environment("RELEASE_RUN_ATTEMPT", r"[1-9][0-9]{0,9}")

          android_identity = identity_file("android-upload-identity.txt")
          android_artifact_digests = identity_file("android-retained-digests.txt")
          ios_identity = identity_file("apple-installed-identity.txt")
          if (
              android_identity.get("android_package") != application_id
              or android_identity.get("android_version_name") != android_version_name
              or android_identity.get("android_version_code") != build_number
              or ios_identity.get("apple_bundle_id") != application_id
              or ios_identity.get("apple_version") != app_version
              or ios_identity.get("apple_build") != build_number
          ):
              fail("observed signed-artifact identity does not match the release")
          android_upload_fingerprint = android_identity.get("android_upload_sha256", "")
          if re.fullmatch(r"(?:[A-F0-9]{2}:){31}[A-F0-9]{2}", android_upload_fingerprint) is None:
              fail("observed Android signer fingerprint is invalid")
          android_signer_sha256 = android_upload_fingerprint.replace(":", "").lower()
          ios_team_id = ios_identity.get("apple_team_id", "")
          ios_signer_sha256 = ios_identity.get("apple_signer_sha256", "")
          if re.fullmatch(r"[A-Z0-9]{10}", ios_team_id) is None or re.fullmatch(
              r"[0-9a-f]{64}", ios_signer_sha256
          ) is None:
              fail("observed Apple signing identity is invalid")

          aab_sha256 = artifact(".aab")
          apk_sha256 = artifact(".apk")
          ipa_sha256 = artifact(".ipa")
          if set(android_artifact_digests) != {
              "android_aab_artifact_sha256",
              "android_apk_artifact_sha256",
          }:
              fail("retained Android digest evidence has an unexpected schema")
          if (
              android_artifact_digests["android_aab_artifact_sha256"] != aab_sha256
              or android_artifact_digests["android_apk_artifact_sha256"] != apk_sha256
              or ios_identity.get("apple_ipa_sha256") != ipa_sha256
          ):
              fail("retained signed artifact changed after verification")

          config_path = pathlib.Path(os.environ["PAKPERK_MOBILE_RELEASE_CONFIG"])
          config = json.loads(config_path.read_text(encoding="utf-8"))
          if config.get("PAKPERK_ENV") != environment:
              fail("materialized mobile config environment does not match the release")
          strict_full_text = config.get("PAKPERK_FULLTEXT_POLICY") == "strict"
          android = {
              "aab_sha256": aab_sha256,
              "apk_sha256": apk_sha256,
              "application_id": application_id,
              "signer_sha256": android_signer_sha256,
          }
          ios = {
              "application_id": application_id,
              "ipa_sha256": ipa_sha256,
              "signer_sha256": ios_signer_sha256,
              "team_id": ios_team_id,
          }
          now = (
              dt.datetime.now(dt.timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          provenance = {
              "android": android,
              "app_version": app_version,
              "build_number": build_number,
              "classification": "protected signed mobile release provenance",
              "created_at": now,
              "environment": environment,
              "ios": ios,
              "schema": 1,
              "source_revision": source_revision,
              "workflow": {
                  "github_run_attempt": run_attempt,
                  "github_run_id": run_id,
                  "job": "signed-candidate",
                  "path": ".github/workflows/mobile-release.yml",
                  "repository": repository,
                  "stage": "artifacts_verified",
                  "workflow_sha": workflow_sha,
              },
          }

          def canonical_json_bytes(value):
              return (
                  json.dumps(
                      value,
                      allow_nan=False,
                      ensure_ascii=True,
                      separators=(",", ":"),
                      sort_keys=True,
                  )
                  + "\n"
              ).encode("ascii")

          evidence_root = root / "evidence"
          provenance_bytes = canonical_json_bytes(provenance)
          provenance_id = "sha256:" + hashlib.sha256(provenance_bytes).hexdigest()
          candidate = {
              "android": android,
              "app_version": app_version,
              "build_number": build_number,
              "classification": "protected signed mobile candidate",
              "environment": environment,
              "ios": ios,
              "provenance_id": provenance_id,
              "schema": 1,
              "source_revision": source_revision,
              "strict_full_text": strict_full_text,
          }
          candidate_bytes = canonical_json_bytes(candidate)
          candidate_id = "sha256:" + hashlib.sha256(candidate_bytes).hexdigest()
          for name, data in (
              ("mobile-release-provenance.json", provenance_bytes),
              ("mobile-candidate.json", candidate_bytes),
          ):
              path = evidence_root / name
              descriptor = os.open(
                  path,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
                  0o600,
              )
              try:
                  remaining = memoryview(data)
                  while remaining:
                      written = os.write(descriptor, remaining)
                      if written <= 0:
                          fail("canonical manifest write did not make progress")
                      remaining = remaining[written:]
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"provenance_id={provenance_id}\n")
              output.write(f"candidate_id={candidate_id}\n")
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Signed mobile candidate\n\n")
              summary.write(f"- Candidate ID: `{candidate_id}`\n")
              summary.write(f"- Provenance ID: `{provenance_id}`\n")

          expected_release_digests = {
              ".aab": aab_sha256,
              ".apk": apk_sha256,
              ".ipa": ipa_sha256,
              "evidence/mobile-release-provenance.json": provenance_id[7:],
              "evidence/mobile-candidate.json": candidate_id[7:],
          }
          observed_release_digests = set()
          lines = []
          for name, release_root in release_roots.items():
              for path in sorted(release_root.rglob("*")):
                  if path.is_symlink():
                      fail("release evidence must not contain symbolic links")
                  if path.is_dir():
                      continue
                  metadata = os.lstat(path)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_nlink != 1
                      or metadata.st_size > 8 * 1024**3
                  ):
                      fail("release evidence contains an unbounded non-regular file")
                  descriptor = os.open(
                      path, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0)
                  )
                  digest = hashlib.sha256()
                  try:
                      before = os.fstat(descriptor)
                      while True:
                          chunk = os.read(descriptor, 1024 * 1024)
                          if not chunk:
                              break
                          digest.update(chunk)
                      after = os.fstat(descriptor)
                  finally:
                      os.close(descriptor)
                  identity = lambda value: (
                      value.st_dev,
                      value.st_ino,
                      value.st_size,
                      value.st_mtime_ns,
                      value.st_ctime_ns,
                  )
                  if identity(metadata) != identity(before) or identity(before) != identity(after):
                      fail("release evidence changed while it was hashed")
                  relative = path.relative_to(root).as_posix()
                  if "\n" in relative or "\r" in relative:
                      fail("release evidence path contains a line break")
                  observed_digest = digest.hexdigest()
                  expected_key = path.suffix if name == "artifacts" else relative
                  if name == "artifacts" and expected_key not in {".aab", ".apk", ".ipa"}:
                      fail("release evidence contains an unexpected retained artifact")
                  if expected_key in expected_release_digests:
                      if observed_digest != expected_release_digests[expected_key]:
                          fail("release evidence no longer matches its content identity")
                      observed_release_digests.add(expected_key)
                  lines.append(f"{observed_digest}  {relative}")
          if observed_release_digests != set(expected_release_digests):
              fail("release evidence is missing a content-addressed artifact or manifest")
          checksum_bytes = ("\n".join(lines) + "\n").encode("utf-8")
          checksum_path = root / "release-sha256.txt"
          descriptor = os.open(
              checksum_path,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
              0o600,
          )
          try:
              remaining = memoryview(checksum_bytes)
              while remaining:
                  written = os.write(descriptor, remaining)
                  if written <= 0:
                      fail("release checksum write did not make progress")
                  remaining = remaining[written:]
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          PY

      - name: Retain signed candidates, symbols, SBOM, and release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pakperk-${{ inputs.environment }}-${{ steps.release.outputs.version_name }}-${{ steps.release.outputs.build_number }}-${{ steps.source.outputs.source_revision }}
          path: |
            ${{ runner.temp }}/artifacts
            ${{ runner.temp }}/symbols
            ${{ runner.temp }}/native-symbols
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/release-sha256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Revalidate retained release evidence after upload
        shell: bash
        working-directory: ${{ runner.temp }}
        run: /usr/bin/shasum -a 256 --check release-sha256.txt

      - name: Upload Android candidate to Google Play internal track
        if: inputs.upload_to_stores
        shell: bash
        env:
          GOOGLE_PLAY_JSON_BASE64: ${{ secrets.PAKPERK_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "google-play.json").write_bytes(
              base64.b64decode(os.environ["GOOGLE_PLAY_JSON_BASE64"], validate=True)
          )
          PY
          chmod 0600 "$RUNNER_TEMP/google-play.json"
          shopt -s nullglob
          aabs=("$RUNNER_TEMP"/artifacts/*.aab)
          if [[ ${#aabs[@]} -ne 1 ]]; then
            echo "Expected exactly one retained AAB." >&2
            exit 1
          fi
          aab="${aabs[0]}"
          "$PAKPERK_BUNDLE_BIN" "_${BUNDLER_VERSION}_" exec fastlane supply \
            --aab "$aab" \
            --package_name "${{ steps.release.outputs.bundle_id }}" \
            --track internal \
            --release_status completed \
            --json_key "$RUNNER_TEMP/google-play.json" \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs true

      - name: Upload iOS candidate to TestFlight
        if: inputs.upload_to_stores
        shell: bash
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.PAKPERK_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_KEY_ID: ${{ secrets.PAKPERK_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_KEY_BASE64: ${{ secrets.PAKPERK_APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          export APP_STORE_KEY_PATH="$key_dir/AuthKey_${APP_STORE_KEY_ID}.p8"
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["APP_STORE_KEY_PATH"]).write_bytes(
              base64.b64decode(os.environ["APP_STORE_KEY_BASE64"], validate=True)
          )
          PY
          chmod 0600 "$APP_STORE_KEY_PATH"
          shopt -s nullglob
          ipas=("$RUNNER_TEMP"/artifacts/*.ipa)
          if [[ ${#ipas[@]} -ne 1 ]]; then
            echo "Expected exactly one retained IPA." >&2
            exit 1
          fi
          ipa="${ipas[0]}"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$APP_STORE_KEY_ID" --apiIssuer "$APP_STORE_ISSUER_ID"

      - name: Remove protected signing material
        if: always()
        shell: bash
        env:
          APP_STORE_KEY_ID: ${{ secrets.PAKPERK_APP_STORE_CONNECT_KEY_ID }}
          PROFILE_UUID: ${{ steps.apple_signing.outputs.profile_uuid }}
        run: |
          security delete-keychain "$RUNNER_TEMP/pakperk-release.keychain-db" >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/pakperk-upload.jks" \
            "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/profile.mobileprovision" \
            "$RUNNER_TEMP/google-play.json" \
            mobile/ios/Flutter/LocalSigning.xcconfig
          if [[ "$PROFILE_UUID" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [[ "$APP_STORE_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          fi
