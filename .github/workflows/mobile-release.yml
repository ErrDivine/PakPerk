          try:
              for environment, filename, allow_empty in (
                  ("ANDROID_STORE_PASSWORD", "store-password", False),
                  ("ANDROID_KEY_ALIAS", "key-alias", False),
                  ("ANDROID_KEY_PASSWORD", "key-password", False),
                  ("ANDROID_APP_SIGNING_SHA256", "app-signing-sha256", True),
