name: protected service exercise

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Reviewed full lowercase commit SHA that exactly matches the selected main revision
        required: true
        type: string
      candidate_id:
        description: Exact protected candidate ID in lowercase sha256 content-ID form
        required: true
        type: string
      deployment_evidence_id:
        description: Passing deployment-binding-v1 evidence ID for the dark-deployed candidate
        required: true
        type: string
      confirmation:
        description: Type RUN_PROTECTED_SERVICE_EXERCISE to authorize synthetic protected-staging actions
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: protected-service-exercise
  cancel-in-progress: false

jobs:
  protected-service-exercise:
    runs-on: [self-hosted, Linux, pakperk-protected-service-exercise]
    environment: protected-staging-service-exercise
    timeout-minutes: 360
    env:
      REQUESTED_REVISION: ${{ inputs.source_revision }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      DEPLOYMENT_EVIDENCE_ID: ${{ inputs.deployment_evidence_id }}
      DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
      RUNNER_SESSION_ID: ${{ vars.PAKPERK_PROTECTED_SERVICE_RUNNER_SESSION_ID }}
      DRIVER_SHA256: ${{ vars.PAKPERK_PROTECTED_SERVICE_DRIVER_SHA256 }}
      VALIDATOR_SHA256: ${{ vars.PAKPERK_PROTECTED_SERVICE_VALIDATOR_SHA256 }}
      WORKFLOW_SHA256: ${{ vars.PAKPERK_PROTECTED_SERVICE_WORKFLOW_SHA256 }}
      DRIVER_REQUEST_CONTRACT_SHA256: sha256:e49f4ef9e1680b1682f5f4f72af0bbd63a98fc0b34e7b4684e713bca45630f48
      PATH: /usr/bin:/bin
      PYTHONDONTWRITEBYTECODE: "1"
      BASH_ENV: /dev/null
      ENV: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact reviewed main source and protected bindings
        id: source
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Protected service exercise must be dispatched from main." >&2
            exit 2
          fi
          if [[ "$DISPATCH_CONFIRMATION" != "RUN_PROTECTED_SERVICE_EXERCISE" ]]; then
            echo "Dispatch confirmation did not match the required phrase." >&2
            exit 2
          fi
          if ! [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_revision must be a full lowercase Git commit SHA." >&2
            exit 2
          fi
          if ! [[ "$CANDIDATE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "candidate_id must be an exact lowercase sha256 content ID." >&2
            exit 2
          fi
          if ! [[ "$DEPLOYMENT_EVIDENCE_ID" =~ ^deployment-binding-v1:sha256:[0-9a-f]{64}$ ]]; then
            echo "deployment_evidence_id must be an exact deployment-binding-v1 content ID." >&2
            exit 2
          fi
          if ! [[ "$RUNNER_SESSION_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The protected runner-session ID is unavailable or invalid." >&2
            exit 2
          fi
          for digest in "$DRIVER_SHA256" "$VALIDATOR_SHA256" "$WORKFLOW_SHA256"; do
            if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "A protected tooling digest is unavailable or invalid." >&2
              exit 2
            fi
          done
          if [[ "$REQUESTED_REVISION" != "$DISPATCH_REVISION" ]]; then
            echo "source_revision must exactly match the selected main revision." >&2
            exit 2
          fi
          if [[ "$(/usr/bin/git rev-parse HEAD)" != "$REQUESTED_REVISION" ]]; then
            echo "Checkout did not resolve the exact requested revision." >&2
            exit 2
          fi
          if [[ "$(/usr/bin/git rev-parse refs/remotes/origin/main)" != "$REQUESTED_REVISION" ]]; then
            echo "The requested revision is not the fetched origin/main tip." >&2
            exit 2
          fi
          observed_workflow_sha="$(/usr/bin/sha256sum .github/workflows/protected-service-exercise.yml)"
          observed_workflow_sha="${observed_workflow_sha%% *}"
          if [[ "$observed_workflow_sha" != "$WORKFLOW_SHA256" ]]; then
            echo "The selected workflow is not the protected reviewed workflow." >&2
            exit 2
          fi
          /usr/bin/python3 -I - "$GITHUB_OUTPUT" <<'PY'
          import os
          import pathlib
          import secrets
          import sys

          output = pathlib.Path(sys.argv[1])
          challenge = secrets.token_hex(32)
          flags = os.O_WRONLY | os.O_APPEND
          if hasattr(os, "O_CLOEXEC"):
              flags |= os.O_CLOEXEC
          descriptor = os.open(output, flags)
          try:
              line = f"challenge={challenge}\n".encode("ascii")
              if os.write(descriptor, line) != len(line):
                  raise SystemExit("challenge output write was incomplete")
          finally:
              os.close(descriptor)
          PY

      - name: Verify root-owned protected driver and validator
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(/usr/bin/uname -s)" != "Linux" ]]; then
            echo "The protected service runner must be Linux." >&2
            exit 2
          fi
          for tool in env git python3 sha256sum uname; do
            if [[ "$(command -v "$tool")" != "/usr/bin/$tool" ]]; then
              echo "A required protected runner tool is not pinned to /usr/bin." >&2
              exit 2
            fi
          done
          /usr/bin/python3 -I - \
            /opt/pakperk/bin/pakperk-protected-service-exercise-driver \
            "$DRIVER_SHA256" \
            /opt/pakperk/bin/pakperk-protected-service-exercise-validator.py \
            "$VALIDATOR_SHA256" <<'PY'
          import hashlib
          import os
          import pathlib
          import stat
          import sys

          def identity(value):
              return (
                  value.st_dev,
                  value.st_ino,
                  value.st_mode,
                  value.st_size,
                  value.st_mtime_ns,
                  value.st_ctime_ns,
              )

          def verify(path_text, expected, executable):
              path = pathlib.Path(path_text)
              for parent in (pathlib.Path("/"), pathlib.Path("/opt"), pathlib.Path("/opt/pakperk"), pathlib.Path("/opt/pakperk/bin")):
                  metadata = os.lstat(parent)
                  if not stat.S_ISDIR(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o022:
                      raise SystemExit("protected tooling parent ownership or mode is unsafe")
              metadata = os.lstat(path)
              if (
                  not stat.S_ISREG(metadata.st_mode)
                  or metadata.st_uid != 0
                  or metadata.st_nlink != 1
                  or metadata.st_mode & 0o022
                  or bool(metadata.st_mode & 0o111) is not executable
                  or metadata.st_size <= 0
                  or metadata.st_size > 4 * 1024 * 1024
              ):
                  raise SystemExit("protected tooling ownership, mode, or size is unsafe")
              flags = os.O_RDONLY
              if hasattr(os, "O_CLOEXEC"):
                  flags |= os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags)
              try:
                  before = os.fstat(descriptor)
                  digest = hashlib.sha256()
                  while True:
                      chunk = os.read(descriptor, 64 * 1024)
                      if not chunk:
                          break
                      digest.update(chunk)
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              current = os.lstat(path)
              if identity(metadata) != identity(before) or identity(before) != identity(after) or identity(after) != identity(current):
                  raise SystemExit("protected tooling changed while it was read")
              if digest.hexdigest() != expected:
                  raise SystemExit("protected tooling digest does not match the approved digest")

          verify(sys.argv[1], sys.argv[2], True)
          verify(sys.argv[3], sys.argv[4], False)
          PY

      - name: Validate fresh root-owned protected runner session
        shell: bash
        run: |
          set -euo pipefail
          runner_session_digest="${RUNNER_SESSION_ID#sha256:}"
          runner_session_manifest="/opt/pakperk/protected-service-runner-sessions/${runner_session_digest}.json"
          /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -I \
            /opt/pakperk/bin/pakperk-protected-service-exercise-validator.py \
            validate-session \
            "$runner_session_manifest" \
            --session-id "$RUNNER_SESSION_ID" \
            --source-revision "$REQUESTED_REVISION"

      - name: Run protected exercise through the data-only driver handoff
        id: exercise
        continue-on-error: true
        shell: bash
        env:
          RUN_CHALLENGE: ${{ steps.source.outputs.challenge }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          request="$RUNNER_TEMP/pakperk-protected-service-request.json"
          result="$RUNNER_TEMP/pakperk-protected-service-evidence.json"
          /usr/bin/python3 -I - "$request" <<'PY'
          import json
          import os
          import pathlib
          import sys

          request = {
              "schema_version": 1,
              "source_revision": os.environ["REQUESTED_REVISION"],
              "candidate_id": os.environ["CANDIDATE_ID"],
              "deployment_evidence_id": os.environ["DEPLOYMENT_EVIDENCE_ID"],
              "protected_environment": "protected-staging-service-exercise",
              "runner_session_id": os.environ["RUNNER_SESSION_ID"],
              "workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["WORKFLOW_RUN_ATTEMPT"]),
              "challenge": os.environ["RUN_CHALLENGE"],
              "driver_sha256": "sha256:" + os.environ["DRIVER_SHA256"],
              "validator_sha256": "sha256:" + os.environ["VALIDATOR_SHA256"],
              "workflow_sha256": "sha256:" + os.environ["WORKFLOW_SHA256"],
              "contract": {
                  "evidence_schema_version": 1,
                  "assertion_count": 29,
                  "measurement_count": 20,
                  "switch_case_count": 6,
                  "invalid_dependency_case_count": 6,
                  "contract_sha256": os.environ["DRIVER_REQUEST_CONTRACT_SHA256"],
              },
              "execution_policy": {
                  "real_protected_observations_required": True,
                  "approved_synthetic_fixtures_only": True,
                  "post_run_owner_approvals_required": True,
                  "raw_credentials_tokens_cookies_network_addresses_ugc_logs_and_operator_identity_forbidden": True,
              },
          }
          serialized = (
              json.dumps(request, allow_nan=False, ensure_ascii=True, separators=(",", ":"), sort_keys=True)
              + "\n"
          ).encode("ascii")
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          if hasattr(os, "O_CLOEXEC"):
              flags |= os.O_CLOEXEC
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          descriptor = os.open(pathlib.Path(sys.argv[1]), flags, 0o600)
          try:
              view = memoryview(serialized)
              while view:
                  written = os.write(descriptor, view)
                  if written <= 0:
                      raise SystemExit("protected driver request write did not make progress")
                  view = view[written:]
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          PY
          unset GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY RUNNER_TEMP
          exec /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            PAKPERK_PROTECTED_DATA_ONLY_HANDOFF=1 \
            /opt/pakperk/bin/pakperk-protected-service-exercise-driver run \
            --request "$request" \
            --output "$result"

      - name: Validate exact sanitized protected exercise evidence
        id: evidence
        if: steps.exercise.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          RUN_CHALLENGE: ${{ steps.source.outputs.challenge }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -I \
            /opt/pakperk/bin/pakperk-protected-service-exercise-validator.py \
            validate \
            "$RUNNER_TEMP/pakperk-protected-service-evidence.json" \
            --source-revision "$REQUESTED_REVISION" \
            --candidate-id "$CANDIDATE_ID" \
            --deployment-evidence-id "$DEPLOYMENT_EVIDENCE_ID" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --challenge "$RUN_CHALLENGE" \
            --runner-session-id "$RUNNER_SESSION_ID" \
            --driver-sha256 "sha256:$DRIVER_SHA256" \
            --validator-sha256 "sha256:$VALIDATOR_SHA256" \
            --workflow-sha256 "sha256:$WORKFLOW_SHA256"

      - name: Upload validated protected service exercise evidence
        id: evidence-upload
        if: steps.evidence.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-service-exercise-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pakperk-protected-service-evidence.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          include-hidden-files: false

      - name: Enforce protected service exercise result
        if: always()
        shell: bash
        env:
          EXERCISE_OUTCOME: ${{ steps.exercise.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence-upload.outcome }}
        run: |
          set -euo pipefail
          if [[ "$EXERCISE_OUTCOME" != "success" || "$EVIDENCE_OUTCOME" != "success" || "$UPLOAD_OUTCOME" != "success" ]]; then
            echo "Protected service exercise, evidence validation, or upload failed closed." >&2
            exit 1
          fi
