log_format pakperk_safe '$status $request_method $uri $body_bytes_sent $request_time';

map $uri $pakperk_cache_control {
    default "no-cache, max-age=0, must-revalidate";
    /config.js "no-store, max-age=0";
    /account-deletion/ "private, no-store, max-age=0";
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout pakperk_safe;
    error_log /dev/stderr warn;

    # Keep the complete header set at one Nginx configuration level. Any
    # location-level add_header would suppress inherited security headers.
    add_header Cache-Control $pakperk_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        try_files $uri =404;
    }

    location = /account-deletion/ {
        access_log /dev/stdout pakperk_safe;
        try_files $uri $uri/index.html =404;
    }

    location ~* \.html$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
