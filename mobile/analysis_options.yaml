include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  errors:
    invalid_use_of_protected_member: error
    invalid_use_of_visible_for_testing_member: error

linter:
  rules:
    avoid_print: true
    # Public dependency-injection parameter names intentionally initialize
    # private fields; initializing formals would leak private implementation
    # names into the cross-library constructor API.
    prefer_initializing_formals: false
    prefer_single_quotes: true
    use_super_parameters: true
