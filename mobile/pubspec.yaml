name: pakperk
description: A phone-first arXiv reader for abstracts, introductions, and paper connections.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  drift: 2.34.3
  drift_flutter: 0.3.1
  flutter_appauth: 12.0.2
  flutter_markdown: ^0.7.7+1
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: 10.3.1
  go_router: ^17.3.0
  path_provider: 2.1.6
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: 2.15.1
  drift_dev: 2.34.3
  flutter_lints: ^5.0.0
  sqlite3: 3.5.0

# Compile the audited SQLite amalgamation from this source tree. This keeps
# Android/iOS builds reproducible and avoids a release build depending on a
# just-in-time GitHub binary download by package:sqlite3's native-assets hook.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite/sqlite3.c

flutter:
  uses-material-design: true
  assets:
    - assets/brand/pakperk_mark.png
    - assets/brand/pakperk_mark_dark.png
    - assets/fallback_feed.json
    - assets/prepared_introductions.json
    - assets/prepared_connections.json
