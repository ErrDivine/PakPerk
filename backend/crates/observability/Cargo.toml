[package]
name = "observability"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
http.workspace = true
opentelemetry = { version = "0.32.0", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "metrics", "tls-ring", "tls-roots", "trace"] }
opentelemetry-semantic-conventions = { version = "0.32.0", features = ["semconv_experimental"] }
opentelemetry_sdk = { version = "0.32.0", features = ["metrics", "rt-tokio", "trace"] }
thiserror.workspace = true
tracing.workspace = true
tracing-opentelemetry = "0.33.0"
tracing-subscriber.workspace = true
url.workspace = true

[lints]
workspace = true
