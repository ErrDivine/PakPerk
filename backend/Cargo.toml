[workspace]
resolver = "2"
members = [
    "apps/admin",
    "apps/api",
    "apps/deletion-worker",
    "apps/migrate",
    "apps/telemetry-gateway",
    "apps/worker",
    "crates/account_deletion",
    "crates/accounts",
    "crates/arxiv_client",
    "crates/auth",
    "crates/db",
    "crates/document_model",
    "crates/domain",
    "crates/grobid_client",
    "crates/http_policy",
    "crates/jobs",
    "crates/library",
    "crates/comments",
    "crates/llm_provider",
    "crates/moderation",
    "crates/observability",
    "crates/opaque_cursor",
    "crates/retrieval",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
account_deletion = { path = "crates/account_deletion" }
accounts = { path = "crates/accounts" }
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.7", features = ["json", "macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
domain = { path = "crates/domain" }
arxiv_client = { path = "crates/arxiv_client" }
auth = { path = "crates/auth" }
comments = { path = "crates/comments" }
db = { path = "crates/db" }
document_model = { path = "crates/document_model" }
grobid_client = { path = "crates/grobid_client" }
jobs = { path = "crates/jobs" }
library = { path = "crates/library" }
# Production auth constructs only public DecodingKeys from provider JWKs.
# AWS-LC avoids the RustCrypto `rsa` implementation's unmaintained Marvin issue.
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["aws_lc_rs"] }
llm_provider = { path = "crates/llm_provider" }
moderation = { path = "crates/moderation" }
observability = { path = "crates/observability" }
opaque_cursor = { path = "crates/opaque_cursor" }
retrieval = { path = "crates/retrieval" }
http = "1.3.1"
http-body-util = "0.1.3"
http_policy = { path = "crates/http_policy" }
hmac = "0.12.1"
mime = "0.3.17"
pgvector = { version = "=0.4.1", features = ["sqlx"] }
quick-xml = { version = "=0.41.0", features = ["serialize"] }
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
ring = "0.17.14"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full", "test-util"] }
tower = { version = "0.5.2", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6.6", features = ["compression-br", "compression-gzip", "cors", "request-id", "trace", "timeout", "limit"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
utoipa = { version = "5.4.0", features = ["uuid"] }
unicode-normalization = "0.1.25"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
